<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz PlayMaths — Algorithme 2nde</title>

  <link rel="stylesheet" href="../style.css">

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js" defer></script>
</head>

<body>

<main class="page">

  <header class="header">
    <h1>Algorithme — 2nde : simulation, Python, géométrie</h1>

    <div class="user-info" id="userForm">
      <input id="nom" type="text" placeholder="Nom" />
      <input id="prenom" type="text" placeholder="Prénom" />
      <button id="startQuiz" class="start">🎮 Commencer le quiz</button>
    </div>
  </header>

  <section class="kahoot-container">

    <div class="timer-and-count">
      <svg width="80" height="80" viewBox="0 0 80 80" class="timer-svg">
        <circle id="timer-circle" cx="40" cy="40" r="35"></circle>
      </svg>
      <div id="timerNumber" class="timer-number">30</div>
    </div>

    <div id="questionBox" class="question-box">
      Appuyez sur « Commencer le quiz » pour lancer.
    </div>

    <div id="graphique-container" class="graphique-container"></div>

    <div id="answerGrid" class="answer-grid"></div>

    <div id="explanationBox" class="explanation" style="display:none;"></div>

    <div id="scoreBox" class="score-box"></div>

  </section>

  <audio id="bgMusic" src="../musique.mp3" preload="auto" loop></audio>
  <audio id="victorySound" src="../jingle.wav" preload="auto"></audio>

</main>

<script src="questions.js" defer></script>
<script src="../../js/quiz.js" defer></script>

<script src="../../js/supabase.js"></script>
<script src="../../js/envoi.js" defer></script>

</body>
</html>
