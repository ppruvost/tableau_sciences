<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="14">
<title id="titre">Schéma : seringue graduée entraînée par une vis micrométrique sur un support « Loi de Mariotte », reliée à un manomètre analogique à aiguille gradué en bar et en hPa</title>
<rect x="0" y="0" width="480" height="300" fill="#ffffff" stroke="none"/>
<!-- Support -->
<rect x="20" y="190" width="260" height="14" rx="3" fill="#f0a84b" stroke="#1f2937" stroke-width="2.5"/>
<rect x="20" y="100" width="14" height="90" fill="#f0a84b" stroke="#1f2937" stroke-width="2.5"/>
<text x="150" y="228" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">support « Loi de Mariotte »</text>
<!-- Vis micrométrique -->
<rect x="34" y="136" width="24" height="18" fill="#b0bec5" stroke="#1f2937" stroke-width="2"/>
<g stroke="#1f2937" stroke-width="1.4">
<line x1="62" y1="140" x2="66" y2="152"/><line x1="72" y1="140" x2="76" y2="152"/><line x1="82" y1="140" x2="86" y2="152"/><line x1="92" y1="140" x2="96" y2="152"/>
</g>
<rect x="58" y="141" width="44" height="8" fill="none" stroke="#1f2937" stroke-width="2"/>
<circle cx="8" cy="145" r="0" stroke="none"/>
<rect x="2" y="128" width="10" height="34" rx="3" fill="#78909c" stroke="#1f2937" stroke-width="2"/>
<line x1="12" y1="145" x2="34" y2="145" stroke="#1f2937" stroke-width="4"/>
<text x="75" y="124" text-anchor="middle" font-size="12" fill="#46607A" stroke="none" font-weight="700">vis</text>
<!-- Seringue graduée -->
<rect x="102" y="128" width="150" height="34" rx="3" fill="#e8f1f8" stroke="#1f2937" stroke-width="2.5"/>
<rect x="140" y="130" width="110" height="30" fill="#cfe6f5" stroke="none"/>
<rect x="134" y="130" width="8" height="30" fill="#37474f" stroke="#1f2937" stroke-width="1.5"/>
<g stroke="#1f2937" stroke-width="1.2">
<line x1="150" y1="128" x2="150" y2="136"/><line x1="170" y1="128" x2="170" y2="136"/><line x1="190" y1="128" x2="190" y2="136"/><line x1="210" y1="128" x2="210" y2="136"/><line x1="230" y1="128" x2="230" y2="136"/>
</g>
<text x="177" y="115" text-anchor="middle" font-size="12" fill="#46607A" stroke="none" font-weight="700">seringue 0 – 60 cm³</text>
<!-- Embout + tuyau -->
<rect x="252" y="139" width="14" height="12" fill="#b0bec5" stroke="#1f2937" stroke-width="2"/>
<path d="M266 145 C 300 145, 300 150, 330 150" stroke="#1f2937" stroke-width="5" fill="none"/>
<path d="M266 145 C 300 145, 300 150, 330 150" stroke="#78909c" stroke-width="2.5" fill="none"/>
<!-- Manomètre -->
<circle cx="392" cy="150" r="62" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
<circle cx="392" cy="150" r="52" fill="#fafbfd" stroke="#46607A" stroke-width="1.2"/>
<g stroke="#1f2937" stroke-width="1.6">
<line x1="392" y1="98" x2="392" y2="108"/>
<line x1="429" y1="113" x2="422" y2="120"/>
<line x1="444" y1="150" x2="434" y2="150"/>
<line x1="355" y1="113" x2="362" y2="120"/>
<line x1="340" y1="150" x2="350" y2="150"/>
</g>
<text x="392" y="124" text-anchor="middle" font-size="10" fill="#1f2937" stroke="none">1</text>
<text x="420" y="136" text-anchor="middle" font-size="10" fill="#1f2937" stroke="none">1,5</text>
<text x="364" y="136" text-anchor="middle" font-size="10" fill="#1f2937" stroke="none">0,5</text>
<line x1="392" y1="150" x2="414" y2="122" stroke="#c62828" stroke-width="3"/>
<circle cx="392" cy="150" r="5" fill="#37474f" stroke="#1f2937" stroke-width="1.5"/>
<text x="392" y="184" text-anchor="middle" font-size="11" fill="#1f2937" stroke="none">bar / hPa</text>
<text x="380" y="228" text-anchor="middle" font-size="12" fill="#46607A" stroke="none" font-weight="700">Manomètre analogique</text>
<text x="300" y="176" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">tuyau</text>
</svg>
