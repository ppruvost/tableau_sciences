<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="14">
<title id="titre">Schéma : disque en rotation de diamètre D avec un point sur sa périphérie, relations f = N/t, T = 1/f et v = π×D×f, exemple de 50 tours en 10,0 s</title>
<rect x="0" y="0" width="760" height="350" fill="#ffffff" stroke="none"/>
<text x="380" y="26" text-anchor="middle" font-size="17" fill="#28394A" stroke="none" font-weight="700">Fréquence de rotation d’un mobile</text><circle cx="175" cy="180" r="95" fill="#e5e9ee" stroke="#1f2937" stroke-width="2.5"/><circle cx="175" cy="180" r="81" fill="none" stroke="#9aa5b1" stroke-width="1"/><circle cx="175" cy="180" r="9" fill="#444" stroke="#1f2937" stroke-width="1.5"/><path d="M80 180L260.0 180.0" fill="none" stroke="#c62828" stroke-width="2.5"/><polygon points="270.0,180.0 260.0,184.5 260.0,175.5" fill="#c62828" stroke="none"/><path d="M270 180L90.0 180.0" fill="none" stroke="#c62828" stroke-width="2.5"/><polygon points="80.0,180.0 90.0,175.5 90.0,184.5" fill="#c62828" stroke="none"/><text x="175" y="168" text-anchor="middle" font-size="18" fill="#c62828" stroke="none" font-weight="700" font-style="italic">D</text><circle cx="234.0529469857131" cy="105.58394358538908" r="7" fill="#1565c0" stroke="none"/><text x="175" y="299" text-anchor="middle" font-size="12" fill="#1565c0" stroke="none">● point sur la périphérie</text><path d="M62 160 A113 113 0 0 1 145 71" fill="none" stroke="#1565c0" stroke-width="3" stroke-linejoin="round"/><path d="M141 73L154.23121538288635 70.243496795232" fill="none" stroke="#1565c0" stroke-width="3"/><polygon points="165.0,68.0 155.2,75.1 153.2,65.4" fill="#1565c0" stroke="none"/><text x="54" y="120" text-anchor="end" font-size="18" fill="#1565c0" stroke="none" font-weight="700" font-style="italic">f</text><rect x="300" y="60" width="440" height="58" rx="8" fill="#e3f1fb" stroke="#6fa6d4" stroke-width="1.4"/><text x="430" y="84" text-anchor="middle" font-size="17" fill="#28394A" stroke="none" font-weight="700">f = N / t</text><text x="610" y="84" text-anchor="middle" font-size="17" fill="#28394A" stroke="none" font-weight="700">T = 1 / f</text><text x="520" y="107" text-anchor="middle" font-size="17" fill="#28394A" stroke="none" font-weight="700">v = π × D × f</text><rect x="300" y="136" width="215" height="196" rx="8" fill="#fafbfd" stroke="#46607A" stroke-width="1.6"/><text x="407.5" y="160" text-anchor="middle" font-size="15" fill="#46607A" stroke="none" font-weight="700">Mesures</text><text x="407" y="184" text-anchor="middle" font-size="14" fill="#1f2937" stroke="none">N = 50 tours</text><text x="407" y="205" text-anchor="middle" font-size="14" fill="#1f2937" stroke="none">t = 10,0 s</text><text x="407" y="226" text-anchor="middle" font-size="14" fill="#1f2937" stroke="none">D = 0,20 m</text><path d="M318 238L497 238" fill="none" stroke="#999" stroke-width="1"/><text x="407" y="262" text-anchor="middle" font-size="14" fill="#1f2937" stroke="none" font-weight="700">f = N/t = 5,00 Hz</text><text x="407" y="286" text-anchor="middle" font-size="14" fill="#1f2937" stroke="none" font-weight="700">T = 1/f = 0,20 s</text><text x="407" y="312" text-anchor="middle" font-size="14" fill="#1f2937" stroke="none" font-weight="700">v = π×D×f = 3,14 m/s</text><rect x="525" y="136" width="215" height="196" rx="8" fill="#fafbfd" stroke="#46607A" stroke-width="1.6"/><text x="632.5" y="160" text-anchor="middle" font-size="15" fill="#46607A" stroke="none" font-weight="700">Grandeurs</text><text x="538" y="182" text-anchor="start" font-size="12" fill="#1f2937" stroke="none">f : fréquence de rotation (Hz)</text><text x="538" y="210" text-anchor="start" font-size="12" fill="#1f2937" stroke="none">T : période (s)</text><text x="538" y="238" text-anchor="start" font-size="12" fill="#1f2937" stroke="none">D : diamètre du mobile (m)</text><text x="538" y="266" text-anchor="start" font-size="12" fill="#1f2937" stroke="none">v : vitesse périphérique (m/s)</text><text x="538" y="294" text-anchor="start" font-size="12" fill="#1f2937" stroke="none">N : nombre de tours ;  t : durée (s)</text>
</svg>
