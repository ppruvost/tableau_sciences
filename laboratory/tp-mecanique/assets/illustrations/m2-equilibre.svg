<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="14">
<title id="titre">Schéma : conditions d’équilibre d’un solide soumis à deux forces opposées, à trois forces concourantes en un point O, et polygone fermé des forces mises bout à bout</title>
<rect x="0" y="0" width="760" height="320" fill="#ffffff" stroke="none"/>
<text x="380" y="26" text-anchor="middle" font-size="17" fill="#28394A" stroke="none" font-weight="700">Conditions d’équilibre de forces concourantes</text><rect x="10" y="46" width="236" height="262" rx="8" fill="#fafbfd" stroke="#28394A" stroke-width="1.6"/><text x="128.0" y="70" text-anchor="middle" font-size="15" fill="#28394A" stroke="none" font-weight="700">Deux forces</text><rect x="262" y="46" width="236" height="262" rx="8" fill="#fafbfd" stroke="#28394A" stroke-width="1.6"/><text x="380.0" y="70" text-anchor="middle" font-size="15" fill="#28394A" stroke="none" font-weight="700">Trois forces concourantes</text><rect x="514" y="46" width="236" height="262" rx="8" fill="#fafbfd" stroke="#28394A" stroke-width="1.6"/><text x="632.0" y="70" text-anchor="middle" font-size="15" fill="#28394A" stroke="none" font-weight="700">Polygone des forces</text><text x="128" y="92" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">même droite d’action,</text><text x="128" y="108" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">sens opposés, même valeur</text><rect x="88" y="160" width="80" height="56" rx="2" fill="#d6e6f5" stroke="#28394A" stroke-width="2.5"/><text x="128" y="184" text-anchor="middle" font-size="15" fill="#28394A" stroke="none" font-weight="700">S</text><circle cx="128" cy="202" r="4" fill="#1f2937" stroke="none"/><path d="M88 188L39.0 188.0" fill="none" stroke="#1565c0" stroke-width="4"/><polygon points="26.0,188.0 39.0,182.2 39.0,193.8" fill="#1565c0" stroke="none"/><text x="50" y="176" text-anchor="middle" font-size="16" fill="#1565c0" stroke="none" font-weight="700" font-style="italic">F₁</text><path d="M168 188L217.0 188.0" fill="none" stroke="#2e7d32" stroke-width="4"/><polygon points="230.0,188.0 217.0,193.8 217.0,182.2" fill="#2e7d32" stroke="none"/><text x="206" y="176" text-anchor="middle" font-size="16" fill="#2e7d32" stroke="none" font-weight="700" font-style="italic">F₂</text><text x="128" y="270" text-anchor="middle" font-size="15" fill="#28394A" stroke="none" font-weight="700">F₁ + F₂ = 0</text><text x="380" y="92" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">les droites d’action se coupent</text><text x="380" y="108" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">en un même point O</text><path d="M380 190L330.6500149667475 155.45501047672326" fill="none" stroke="#1565c0" stroke-width="4"/><polygon points="320.0,148.0 334.0,150.7 327.3,160.2" fill="#1565c0" stroke="none"/><text x="318" y="140" text-anchor="middle" font-size="16" fill="#1565c0" stroke="none" font-weight="700" font-style="italic">F₁</text><path d="M380 190L429.3499850332525 155.45501047672326" fill="none" stroke="#2e7d32" stroke-width="4"/><polygon points="440.0,148.0 432.7,160.2 426.0,150.7" fill="#2e7d32" stroke="none"/><text x="444" y="140" text-anchor="middle" font-size="16" fill="#2e7d32" stroke="none" font-weight="700" font-style="italic">F₂</text><path d="M380 190L380.0 249.0" fill="none" stroke="#c62828" stroke-width="4"/><polygon points="380.0,262.0 374.1,249.0 385.9,249.0" fill="#c62828" stroke="none"/><text x="396" y="244" text-anchor="middle" font-size="16" fill="#c62828" stroke="none" font-weight="700" font-style="italic">F₃</text><circle cx="380" cy="190" r="9" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><text x="398" y="200" text-anchor="start" font-size="13" fill="#1f2937" stroke="none" font-weight="700">O</text><text x="380" y="292" text-anchor="middle" font-size="15" fill="#28394A" stroke="none" font-weight="700">F₁ + F₂ + F₃ = 0</text><text x="632" y="92" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">mis bout à bout, les vecteurs</text><text x="632" y="108" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">forment un triangle fermé</text><path d="M580 230L648.730218060252 190.48012461535507" fill="none" stroke="#2e7d32" stroke-width="4"/><polygon points="660.0,184.0 651.6,195.6 645.8,185.4" fill="#2e7d32" stroke="none"/><text x="630" y="222" text-anchor="middle" font-size="16" fill="#2e7d32" stroke="none" font-weight="700" font-style="italic">F₂</text><path d="M660 184L591.3908068127964 146.26494374703802" fill="none" stroke="#1565c0" stroke-width="4"/><polygon points="580.0,140.0 594.2,141.1 588.6,151.4" fill="#1565c0" stroke="none"/><text x="640" y="150" text-anchor="middle" font-size="16" fill="#1565c0" stroke="none" font-weight="700" font-style="italic">F₁</text><path d="M580 140L580.0 217.0" fill="none" stroke="#c62828" stroke-width="4"/><polygon points="580.0,230.0 574.1,217.0 585.9,217.0" fill="#c62828" stroke="none"/><text x="558" y="190" text-anchor="middle" font-size="16" fill="#c62828" stroke="none" font-weight="700" font-style="italic">F₃</text><text x="632" y="270" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">échelle : 1 cm ↔ 1 N</text>
</svg>
