" y="50" width="250" height="300" rx="6" fill="#f5f8fc" stroke="#28394A" stroke-width="1.6"/><text x="625" y="76" text-anchor="middle" font-size="14" fill="#28394A" stroke="none" font-weight="700">③ Calculer le poids</text><text x="625" y="122" text-anchor="middle" font-size="26" fill="#28394A" stroke="none" font-weight="700" font-style="italic">P = m × g</text><text x="625" y="160" text-anchor="middle" font-size="13" fill="#1f2937" stroke="none">P : poids (N)</text><text x="625" y="182" text-anchor="middle" font-size="13" fill="#1f2937" stroke="none">m : masse (kg)</text><text x="625" y="204" text-anchor="middle" font-size="13" fill="#1f2937" stroke="none">g : intensité de la pesanteur</text><text x="625" y="226" text-anchor="middle" font-size="13" fill="#1f2937" stroke="none">≈ 9,81 N/kg sur Terre</text><text x="625" y="278" text-anchor="middle" font-size="16" fill="#c62828" stroke="none">P = 0,200 × 9,81</text><text x="625" y="308" text-anchor="middle" font-size="18" fill="#c62828" stroke="none" font-weight="700">P ≈ 1,96 N</text>
