<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 455" width="760" height="455" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="14">
<title id="titre">Schéma du protocole : poids du solide dans l’air (2,5 N) puis immergé (1,5 N) au dynamomètre, force d’Archimède F_A = P₁ − P₂ = 1,0 N, mesure du volume immergé à l’éprouvette graduée (30 mL) et valeur théorique F_A ≈ 0,98 N</title>
