<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="14">
<title id="titre">Schéma du protocole : enregistrer le mouvement (vidéo, chronophotographie, ExAO, simulateur), relever v₁ = 2,0 m/s et v₂ = 5,0 m/s à deux instants, calculer l’accélération moyenne a = 1,5 m/s² et tracer v = f(t)</title>
<rect x="0" y="0" width="760" height="460" fill="#ffffff" stroke="none"/>
<text x="380" y="26" text-anchor="middle" font-size="17" fill="#28394A" stroke="none" font-weight="700">Protocole — vitesse et accélération d’un mouvement rectiligne</text><rect x="10" y="44" width="740" height="96" rx="8" fill="#fafbfd" stroke="#46607A" stroke-width="1.6"/><text x="380.0" y="68" text-anchor="middle" font-size="15" fill="#46607A" stroke="none" font-weight="700">① Enregistrer le mouvement rectiligne d’un mobile</text><rect x="58" y="78" width="124" height="40" rx="6" fill="#eef2f6" stroke="#9fb0c0" stroke-width="1.2"/><text x="120" y="103" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none" font-weight="700">Vidéo</text><rect x="233" y="78" width="124" height="40" rx="6" fill="#eef2f6" stroke="#9fb0c0" stroke-width="1.2"/><text x="295" y="103" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none" font-weight="700">Chronophotographie</text><rect x="408" y="78" width="124" height="40" rx="6" fill="#eef2f6" stroke="#9fb0c0" stroke-width="1.2"/><text x="470" y="103" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none" font-weight="700">ExAO</text><rect x="583" y="78" width="124" height="40" rx="6" fill="#eef2f6" stroke="#9fb0c0" stroke-width="1.2"/><text x="645" y="103" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none" font-weight="700">Simulateur</text><rect x="10" y="152" width="740" height="120" rx="8" fill="#fafbfd" stroke="#46607A" stroke-width="1.6"/><text x="380.0" y="176" text-anchor="middle" font-size="15" fill="#46607A" stroke="none" font-weight="700">② Relever la vitesse à deux instants successifs</text><rect x="40" y="198" width="110" height="44" rx="4" fill="#d6e6f5" stroke="#28394A" stroke-width="1.6"/><text x="95" y="216" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none" font-weight="700">t₁ → v₁ = 2,0 m/s</text><text x="95" y="234" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none" font-weight="700">t₂ → v₂ = 5,0 m/s</text><path d="M300 250L460 250" fill="none" stroke="#1f2937" stroke-width="2"/><rect x="310" y="222" width="52" height="22" rx="3" fill="#8ab4e8" stroke="#28394A" stroke-width="1.6"/><circle cx="320" cy="246" r="5" fill="#fff" stroke="#1f2937" stroke-width="2"/><circle cx="320" cy="246" r="2" fill="#1f2937" stroke="none"/><circle cx="352" cy="246" r="5" fill="#fff" stroke="#1f2937" stroke-width="2"/><circle cx="352" cy="246" r="2" fill="#1f2937" stroke="none"/><path d="M366 233L391.0 233.0" fill="none" stroke="#1565c0" stroke-width="2.5"/><polygon points="400.0,233.0 391.0,237.1 391.0,228.9" fill="#1565c0" stroke="none"/><text x="338" y="214" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">t₁ : v₁ = 2,0 m/s</text><path d="M520 250L740 250" fill="none" stroke="#1f2937" stroke-width="2"/><rect x="540" y="222" width="52" height="22" rx="3" fill="#8ab4e8" stroke="#28394A" stroke-width="1.6"/><circle cx="550" cy="246" r="5" fill="#fff" stroke="#1f2937" stroke-width="2"/><circle cx="550" cy="246" r="2" fill="#1f2937" stroke="none"/><circle cx="582" cy="246" r="5" fill="#fff" stroke="#1f2937" stroke-width="2"/><circle cx="582" cy="246" r="2" fill="#1f2937" stroke="none"/><path d="M596 233L681.0 233.0" fill="none" stroke="#1565c0" stroke-width="2.5"/><polygon points="690.0,233.0 681.0,237.1 681.0,228.9" fill="#1565c0" stroke="none"/><text x="620" y="214" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">t₂ : v₂ = 5,0 m/s</text><rect x="10" y="284" width="740" height="166" rx="8" fill="#fafbfd" stroke="#46607A" stroke-width="1.6"/><text x="380.0" y="308" text-anchor="middle" font-size="15" fill="#46607A" stroke="none" font-weight="700">③ Calculer l’accélération moyenne puis tracer v = f(t)</text><text x="200" y="344" text-anchor="middle" font-size="17" fill="#28394A" stroke="none" font-weight="700">a = (v₂ − v₁) / (t₂ − t₁)</text><text x="200" y="368" text-anchor="middle" font-size="13" fill="#1f2937" stroke="none">avec t₂ − t₁ = 2,0 s :</text><text x="200" y="394" text-anchor="middle" font-size="15" fill="#1f2937" stroke="none" font-weight="700">a = (5,0 − 2,0) / 2,0 = 1,5 m/s²</text><text x="200" y="422" text-anchor="middle" font-size="13" fill="#1f2937" stroke="none">La vitesse augmente linéairement :</text><text x="200" y="440" text-anchor="middle" font-size="13" fill="#1f2937" stroke="none">mouvement uniformément accéléré.</text><path d="M470 420L700 420" fill="none" stroke="#1f2937" stroke-width="1.6"/><path d="M470 420L470 322" fill="none" stroke="#1f2937" stroke-width="1.6"/><path d="M490 420L490 425" fill="none" stroke="#1f2937" stroke-width="1"/><text x="490" y="438" text-anchor="middle" font-size="11" fill="#1f2937" stroke="none">0</text><path d="M540 420L540 425" fill="none" stroke="#1f2937" stroke-width="1"/><text x="540" y="438" text-anchor="middle" font-size="11" fill="#1f2937" stroke="none">1</text><path d="M590 420L590 425" fill="none" stroke="#1f2937" stroke-width="1"/><text x="590" y="438" text-anchor="middle" font-size="11" fill="#1f2937" stroke="none">2</text><path d="M640 420L640 425" fill="none" stroke="#1f2937" stroke-width="1"/><text x="640" y="438" text-anchor="middle" font-size="11" fill="#1f2937" stroke="none">3</text><path d="M690 420L690 425" fill="none" stroke="#1f2937" stroke-width="1"/><text x="690" y="438" text-anchor="middle" font-size="11" fill="#1f2937" stroke="none">4</text><text x="710" y="424" text-anchor="start" font-size="11" fill="#1f2937" stroke="none">t (s)</text><text x="476" y="324" text-anchor="start" font-size="11" fill="#1f2937" stroke="none">v (m/s)</text><path d="M465 420L470 420" fill="none" stroke="#1f2937" stroke-width="1"/><text x="461" y="424" text-anchor="end" font-size="11" fill="#1f2937" stroke="none">0</text><path d="M465 386L470 386" fill="none" stroke="#1f2937" stroke-width="1"/><text x="461" y="390" text-anchor="end" font-size="11" fill="#1f2937" stroke="none">2</text><path d="M465 352L470 352" fill="none" stroke="#1f2937" stroke-width="1"/><text x="461" y="356" text-anchor="end" font-size="11" fill="#1f2937" stroke="none">4</text><path d="M490 386L590 335" fill="none" stroke="#1565c0" stroke-width="3"/><circle cx="490" cy="386" r="5" fill="#1565c0" stroke="none"/><circle cx="590" cy="335" r="5" fill="#1565c0" stroke="none"/>
</svg>
