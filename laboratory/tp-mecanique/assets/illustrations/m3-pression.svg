<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="14">
<title id="titre">Schéma : pression exercée par une presse sur une surface S (P = F/S), seringue fermée reliée à un manomètre pour relever le volume V et la pression P, et courbe P en fonction de V traduisant P × V constante</title>
<rect x="0" y="0" width="760" height="480" fill="#ffffff" stroke="none"/>
<text x="380" y="26" text-anchor="middle" font-size="17" fill="#28394A" stroke="none" font-weight="700">Pression, force pressante et loi de Boyle-Mariotte</text><rect x="10" y="44" width="360" height="260" rx="8" fill="#fafbfd" stroke="#46607A" stroke-width="1.6"/><text x="190.0" y="68" text-anchor="middle" font-size="15" fill="#46607A" stroke="none" font-weight="700">① Presse : P = F / S</text><rect x="130" y="200" width="120" height="70" rx="2" fill="#f0a84b" stroke="#1f2937" stroke-width="2.5"/><rect x="160" y="150" width="60" height="50" rx="2" fill="#b0bec5" stroke="#1f2937" stroke-width="2.5"/><rect x="150" y="110" width="80" height="40" rx="2" fill="#e0e4e8" stroke="#1f2937" stroke-width="2.5"/><path d="M190 82L190.0 97.0" fill="none" stroke="#c62828" stroke-width="4"/><polygon points="190.0,110.0 184.2,97.0 195.8,97.0" fill="#c62828" stroke="none"/><text x="204" y="100" text-anchor="start" font-size="16" fill="#c62828" stroke="none" font-weight="700" font-style="italic">F</text><path d="M160 290L212.0 290.0" fill="none" stroke="#1565c0" stroke-width="2"/><polygon points="220.0,290.0 212.0,293.6 212.0,286.4" fill="#1565c0" stroke="none"/><path d="M220 290L168.0 290.0" fill="none" stroke="#1565c0" stroke-width="2"/><polygon points="160.0,290.0 168.0,286.4 168.0,293.6" fill="#1565c0" stroke="none"/><text x="190" y="284" text-anchor="middle" font-size="12" fill="#1565c0" stroke="none">surface S</text><text x="26" y="100" text-anchor="start" font-size="12" fill="#1f2937" stroke="none">P : pression (Pa)</text><text x="26" y="120" text-anchor="start" font-size="12" fill="#1f2937" stroke="none">F : force (N)</text><text x="26" y="140" text-anchor="start" font-size="12" fill="#1f2937" stroke="none">S : surface (m²)</text><rect x="390" y="44" width="360" height="260" rx="8" fill="#fafbfd" stroke="#46607A" stroke-width="1.6"/><text x="570.0" y="68" text-anchor="middle" font-size="15" fill="#46607A" stroke="none" font-weight="700">② Seringue fermée et manomètre</text><rect x="430" y="170" width="170" height="60" rx="22" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><path d="M480 170L480 230" fill="none" stroke="#888" stroke-width="2"/><path d="M412 200L430 200" fill="none" stroke="#1f2937" stroke-width="3"/><rect x="600" y="190" width="30" height="22" rx="2" fill="#9aa5af" stroke="#1f2937" stroke-width="2"/><path d="M615 190 C615 150 645 150 650 150" fill="none" stroke="#1f2937" stroke-width="5" stroke-linejoin="round"/><circle cx="680" cy="130" r="36" fill="#e3f2fd" stroke="#1f2937" stroke-width="3"/><text x="680" y="128" text-anchor="middle" font-size="16" fill="#1f2937" stroke="none" font-weight="700" font-style="italic">P</text><text x="680" y="148" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">kPa</text><path d="M430 252L591.0 252.0" fill="none" stroke="#1565c0" stroke-width="2"/><polygon points="600.0,252.0 591.0,256.1 591.0,247.9" fill="#1565c0" stroke="none"/><path d="M600 252L439.0 252.0" fill="none" stroke="#1565c0" stroke-width="2"/><polygon points="430.0,252.0 439.0,247.9 439.0,256.1" fill="#1565c0" stroke="none"/><text x="515" y="274" text-anchor="middle" font-size="12" fill="#1565c0" stroke="none">volume V (piston déplacé)</text><text x="410" y="96" text-anchor="start" font-size="12" fill="#1f2937" stroke="none">1. fermer le robinet</text><text x="410" y="114" text-anchor="start" font-size="12" fill="#1f2937" stroke="none">2. déplacer le piston</text><text x="410" y="132" text-anchor="start" font-size="12" fill="#1f2937" stroke="none">3. relever V et P</text><rect x="10" y="316" width="740" height="150" rx="8" fill="#fafbfd" stroke="#46607A" stroke-width="1.6"/><text x="380.0" y="340" text-anchor="middle" font-size="15" fill="#46607A" stroke="none" font-weight="700">③ Exploiter les mesures</text><text x="130" y="372" text-anchor="middle" font-size="17" fill="#28394A" stroke="none" font-weight="700">P × V = constante</text><text x="130" y="398" text-anchor="middle" font-size="14" fill="#1f2937" stroke="none">donc P₁ × V₁ = P₂ × V₂</text><text x="130" y="428" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">(à température constante)</text><path d="M330 446L550 446" fill="none" stroke="#1f2937" stroke-width="1.6"/><path d="M330 446L330 352" fill="none" stroke="#1f2937" stroke-width="1.6"/><text x="556" y="450" text-anchor="start" font-size="12" fill="#1f2937" stroke="none" font-style="italic">V</text><text x="338" y="360" text-anchor="start" font-size="12" fill="#1f2937" stroke="none" font-style="italic">P</text><path d="M360.0 359.3 L368.4 378.3 L376.8 390.4 L385.2 398.9 L393.6 405.1 L402.0 409.9 L410.4 413.7 L418.8 416.7 L427.2 419.3 L435.6 421.4 L444.0 423.2 L452.4 424.8 L460.8 426.1 L469.2 427.3 L477.6 428.4 L486.0 429.3 L494.4 430.2 L502.8 431.0 L511.2 431.7 L519.6 432.3" fill="none" stroke="#c62828" stroke-width="3" stroke-linejoin="round"/><circle cx="360.0" cy="359.3333333333333" r="4" fill="#1f2937" stroke="none"/><circle cx="393.6" cy="405.1194968553459" r="4" fill="#1f2937" stroke="none"/><circle cx="435.6" cy="421.3787878787879" r="4" fill="#1f2937" stroke="none"/><circle cx="477.6" cy="428.3848238482385" r="4" fill="#1f2937" stroke="none"/><circle cx="519.6" cy="432.2869198312236" r="4" fill="#1f2937" stroke="none"/><rect x="580" y="350" width="150" height="90" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.4"/><text x="655" y="372" text-anchor="middle" font-size="13" fill="#1f2937" stroke="none" font-weight="700">Sécurité</text><text x="655" y="392" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">ne pas dépasser la</text><text x="655" y="408" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">pression maximale ;</text><text x="655" y="424" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">lunettes de protection</text>
</svg>
