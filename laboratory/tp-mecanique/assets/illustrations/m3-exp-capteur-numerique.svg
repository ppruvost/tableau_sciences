<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="14">
<title id="titre">Schéma : seringue reliée par un tuyau souple à un capteur de pression numérique dont l'écran affiche P = 1006 hPa</title>
<rect x="0" y="0" width="480" height="300" fill="#ffffff" stroke="none"/>
<!-- Seringue -->
<rect x="40" y="120" width="130" height="46" rx="3" fill="#e8f1f8" stroke="#1f2937" stroke-width="2.5"/>
<g stroke="#1f2937" stroke-width="1.2">
<line x1="60" y1="120" x2="60" y2="130"/><line x1="80" y1="120" x2="80" y2="130"/><line x1="100" y1="120" x2="100" y2="130"/><line x1="120" y1="120" x2="120" y2="130"/><line x1="140" y1="120" x2="140" y2="130"/><line x1="160" y1="120" x2="160" y2="130"/>
</g>
<!-- Gaz enfermé -->
<rect x="92" y="122" width="76" height="42" fill="#cfe6f5" stroke="none"/>
<text x="130" y="149" text-anchor="middle" font-size="13" fill="#46607A" stroke="none" font-style="italic">air (V)</text>
<!-- Piston et tige -->
<rect x="86" y="122" width="8" height="42" fill="#37474f" stroke="#1f2937" stroke-width="1.5"/>
<line x1="40" y1="143" x2="86" y2="143" stroke="#1f2937" stroke-width="4"/>
<rect x="18" y="125" width="10" height="36" rx="2" fill="#b0bec5" stroke="#1f2937" stroke-width="2.5"/>
<line x1="28" y1="143" x2="40" y2="143" stroke="#1f2937" stroke-width="4"/>
<!-- Flèche déplacement piston -->
<path d="M60 196L110 196" stroke="#1565c0" stroke-width="2"/>
<polygon points="118,196 110,192.4 110,199.6" fill="#1565c0" stroke="none"/>
<polygon points="52,196 60,192.4 60,199.6" fill="#1565c0" stroke="none"/>
<text x="85" y="216" text-anchor="middle" font-size="12" fill="#1565c0" stroke="none">piston déplacé à la main</text>
<!-- Embout + tuyau -->
<rect x="170" y="137" width="14" height="12" fill="#b0bec5" stroke="#1f2937" stroke-width="2"/>
<path d="M184 143 C 230 143, 230 215, 290 215" stroke="#1f2937" stroke-width="5" fill="none"/>
<path d="M184 143 C 230 143, 230 215, 290 215" stroke="#78909c" stroke-width="2.5" fill="none"/>
<!-- Capteur numérique -->
<rect x="290" y="150" width="150" height="110" rx="8" fill="#eceff1" stroke="#1f2937" stroke-width="2.5"/>
<rect x="306" y="166" width="118" height="46" rx="4" fill="#cfe8c8" stroke="#1f2937" stroke-width="2"/>
<text x="365" y="196" text-anchor="middle" font-size="20" font-weight="700" font-family="monospace" fill="#1f2937" stroke="none">1006 hPa</text>
<circle cx="330" cy="236" r="9" fill="#b0bec5" stroke="#1f2937" stroke-width="1.8"/>
<circle cx="365" cy="236" r="9" fill="#b0bec5" stroke="#1f2937" stroke-width="1.8"/>
<circle cx="400" cy="236" r="9" fill="#b0bec5" stroke="#1f2937" stroke-width="1.8"/>
<text x="350" y="282" text-anchor="middle" font-size="12" fill="#46607A" stroke="none" font-weight="700">Capteur de pression numérique</text>
<text x="130" y="108" text-anchor="middle" font-size="13" fill="#46607A" stroke="none" font-weight="700">Seringue</text>
<text x="230" y="250" text-anchor="middle" font-size="12" fill="#1f2937" stroke="none">tuyau souple</text>
</svg>
