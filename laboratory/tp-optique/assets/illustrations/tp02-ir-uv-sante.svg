<rect x="20.0" y="20.0" width="290.0" height="150.0" rx="8" fill="#fafafa" stroke="#6a3dbd" stroke-width="2" /><rect x="20.0" y="20.0" width="290.0" height="34.0" rx="8" fill="#6a3dbd" stroke="#6a3dbd" stroke-width="2" /><text x="165.0" y="43.0" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">Ultraviolet (UV) — λ &lt; 400 nm</text><text x="34.0" y="80.0" text-anchor="start" font-size="12.5" fill="#222222">Peau : brûlure, vieillissement,</text><text x="34.0" y="100.0" text-anchor="start" font-size="12.5" fill="#222222">risque de cancer</text><text x="34.0" y="128.0" text-anchor="start" font-size="12.5" fill="#222222">Œil : lésion de la cornée ou de</text><text x="34.0" y="148.0" text-anchor="start" font-size="12.5" fill="#222222">la rétine (photokératite)</text><text x="165.0" y="166.0" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">invisible à l'œil humain</text><rect x="330.0" y="20.0" width="290.0" height="150.0" rx="8" fill="#fafafa" stroke="#b0473b" stroke-width="2" /><rect x="330.0" y="20.0" width="290.0" height="34.0" rx="8" fill="#b0473b" stroke="#b0473b" stroke-width="2" /><text x="475.0" y="43.0" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">Infrarouge (IR) — λ &gt; 700 nm</text><text x="344.0" y="80.0" text-anchor="start" font-size="12.5" fill="#222222">Tissus : échauffement, brûlure</text><text x="344.0" y="100.0" text-anchor="start" font-size="12.5" fill="#222222">profonde sans sensation immédiate</text><text x="344.0" y="128.0" text-anchor="start" font-size="12.5" fill="#222222">Œil : risque de cataracte en cas</text><text x="344.0" y="148.0" text-anchor="start" font-size="12.5" fill="#222222">d'exposition répétée et intense</text><text x="475.0" y="166.0" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">invisible à l'œil humain</text><line x1="165.0" y1="172.0" x2="165.0" y2="191.0" stroke="#6a3dbd" stroke-width="2.5" stroke-linecap="round"/><polygon points="165.0,198.0 161.2,189.8 168.8,189.8" fill="#6a3dbd"/><line x1="475.0" y1="172.0" x2="475.0" y2="191.0" stroke="#b0473b" stroke-width="2.5" stroke-linecap="round"/><polygon points="475.0,198.0 471.2,189.8 478.8,189.8" fill="#b0473b"/><rect x="20.0" y="200.0" width="600.0" height="62.0" rx="8" fill="#ecfdf5" stroke="#43a047" stroke-width="2" /><text x="320.0" y="224.0" text-anchor="middle" font-size="14" fill="#166534" font-weight="bold">Protection</text><text x="320.0" y="246.0" text-anchor="middle" font-size="12.5" fill="#222222">lunettes adaptées · vêtements couvrants · limiter la durée et la proximité d'exposition</text>
