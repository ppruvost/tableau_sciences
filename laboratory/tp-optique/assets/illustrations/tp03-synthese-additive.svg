<rect x="30.0" y="20.0" width="270.0" height="230.0" rx="0" fill="#111111" stroke="#222222" stroke-width="2" /><circle cx="130.0" cy="105.0" r="62" fill="#e53935" stroke="none" stroke-width="0" /><circle cx="194.0" cy="105.0" r="62" fill="#2ecc40" stroke="none" stroke-width="0" /><circle cx="162.0" cy="160.0" r="62" fill="#1e88e5" stroke="none" stroke-width="0" /><g clip-path="url(#cR)"><circle cx="194" cy="105" r="62" fill="#ffee00"/></g><g clip-path="url(#cR)"><circle cx="162" cy="160" r="62" fill="#ff00ff"/></g><g clip-path="url(#cG)"><circle cx="162" cy="160" r="62" fill="#00ffff"/></g><g clip-path="url(#cR)"><g clip-path="url(#cG)"><circle cx="162" cy="160" r="62" fill="#ffffff"/></g></g><text x="95.0" y="78.0" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold">R</text><text x="230.0" y="78.0" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold">V</text><text x="162.0" y="205.0" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold">B</text><text x="165.0" y="240.0" text-anchor="middle" font-size="11" fill="#d1d5db">Écran</text><text x="330.0" y="44.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">Superposition de lumières :</text><rect x="330.0" y="61.0" width="28.0" height="24.0" rx="3" fill="#ffee00" stroke="#222222" stroke-width="1.5" /><text x="372.0" y="78.0" text-anchor="start" font-size="14" fill="#222222">rouge + vert = jaune</text><rect x="330.0" y="99.0" width="28.0" height="24.0" rx="3" fill="#ff00ff" stroke="#222222" stroke-width="1.5" /><text x="372.0" y="116.0" text-anchor="start" font-size="14" fill="#222222">rouge + bleu = magenta</text><rect x="330.0" y="137.0" width="28.0" height="24.0" rx="3" fill="#00ffff" stroke="#222222" stroke-width="1.5" /><text x="372.0" y="154.0" text-anchor="start" font-size="14" fill="#222222">vert + bleu = cyan</text><rect x="330.0" y="175.0" width="28.0" height="24.0" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text x="372.0" y="192.0" text-anchor="start" font-size="14" fill="#222222">rouge + vert + bleu = blanc</text><text x="330.0" y="232.0" text-anchor="start" font-size="12" fill="#6b7280" font-style="italic">On additionne des lumières :</text><text x="330.0" y="248.0" text-anchor="start" font-size="12" fill="#6b7280" font-style="italic">le résultat est plus lumineux.</text>
