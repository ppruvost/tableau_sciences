<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" width="700" height="310" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="14">
<title id="titre">Classement de plusieurs matériaux isolants selon l'atténuation mesurée, du moins isolant au plus isolant</title>
<rect x="0" y="0" width="700" height="310" fill="#ffffff" stroke="none"/>

            <text x="320.0" y="26.0" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" stroke="none">Atténuation mesurée pour une même épaisseur</text><path d="M150.0 48.0L150.0 230.0" fill="none" stroke="currentColor" stroke-width="2"/><rect x="150" y="62" width="250" height="26" fill="#1B6CA8" fill-opacity="0.90" stroke="none"/><text x="140.0" y="80.0" text-anchor="end" font-size="14" fill="currentColor" stroke="none">Matériau 1</text><rect x="150" y="104" width="190" height="26" fill="#1B6CA8" fill-opacity="0.72" stroke="none"/><text x="140.0" y="122.0" text-anchor="end" font-size="14" fill="currentColor" stroke="none">Matériau 2</text><rect x="150" y="146" width="130" height="26" fill="#1B6CA8" fill-opacity="0.54" stroke="none"/><text x="140.0" y="164.0" text-anchor="end" font-size="14" fill="currentColor" stroke="none">Matériau 3</text><rect x="150" y="188" width="80" height="26" fill="#1B6CA8" fill-opacity="0.36" stroke="none"/><text x="140.0" y="206.0" text-anchor="end" font-size="14" fill="currentColor" stroke="none">Matériau 4</text><path d="M150.0 230.0L520.0 230.0" fill="none" stroke="currentColor" stroke-width="2"/><text x="335.0" y="256.0" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">atténuation (dB)</text><path d="M150.0 276.0L521.0 276.0" stroke="#1B6CA8" stroke-width="2.4" fill="none"/><polygon points="530.0,276.0 521.0,271.5 521.0,280.5" fill="#1B6CA8" stroke="none"/><text x="150.0" y="296.0" text-anchor="start" font-size="13" fill="currentColor" stroke="none">moins isolant</text><text x="530.0" y="296.0" text-anchor="end" font-size="13" fill="currentColor" stroke="none">plus isolant</text>
          
</svg>
