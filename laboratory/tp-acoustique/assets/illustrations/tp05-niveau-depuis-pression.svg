            <circle cx="70.0" cy="100.0" r="16" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M65.0 92.0L65.0 108.0" fill="none" stroke="currentColor" stroke-width="4"/><text x="70.0" y="150.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">capteur de pression</text><text x="70.0" y="166.0" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">acoustique</text><path d="M17.7 89.7A16 16 0 0 0 17.7 110.3" fill="none" stroke="#1B6CA8" stroke-width="2.4" stroke-linecap="round" stroke-opacity="1.00"/><path d="M7.8 81.4A29 29 0 0 0 7.8 118.6" fill="none" stroke="#1B6CA8" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.78"/><path d="M-2.2 73.0A42 42 0 0 0 -2.2 127.0" fill="none" stroke="#1B6CA8" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.56"/><path d="M96.0 100.0L141.0 100.0" stroke="currentColor" stroke-width="2.2" fill="none"/><polygon points="150.0,100.0 141.0,95.5 141.0,104.5" fill="currentColor" stroke="none"/><rect x="150.0" y="70.0" width="100.0" height="60.0" fill="none" stroke="currentColor" stroke-width="2.2"/><text x="200.0" y="106.0" text-anchor="middle" font-size="17" font-style="italic" font-weight="700" fill="currentColor" stroke="none">p (Pa)</text><path d="M250.0 100.0L281.0 100.0" stroke="currentColor" stroke-width="2.2" fill="none"/><polygon points="290.0,100.0 281.0,95.5 281.0,104.5" fill="currentColor" stroke="none"/><rect x="290.0" y="70.0" width="220.0" height="60.0" fill="none" stroke="currentColor" stroke-width="2.2"/><text x="400.0" y="96.0" text-anchor="middle" font-size="17" font-style="italic" font-weight="700" fill="currentColor" stroke="none">L = 20 × log ( p / p₀ )</text><text x="400.0" y="116.0" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">p₀ = 2×10⁻⁵ Pa (seuil d'audition)</text><path d="M510.0 100.0L541.0 100.0" stroke="currentColor" stroke-width="2.2" fill="none"/><polygon points="550.0,100.0 541.0,95.5 541.0,104.5" fill="currentC