<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 215" width="760" height="215" font-family="Arial, Helvetica, sans-serif">
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="760" height="215" fill="#ffffff"/>
<text x="50" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Information</text>
<line x1="92" y1="92" x2="116" y2="92" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
<rect x="120" y="60" width="130" height="64" rx="10" fill="#eef3fb" stroke="#2563eb" stroke-width="2.5"/>
<text x="185.0" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Émetteur</text>
<text x="185.0" y="150" text-anchor="middle" font-size="12.5" fill="#222">transforme l'information</text>
<text x="185.0" y="167" text-anchor="middle" font-size="12.5" fill="#222">en onde</text>
<line x1="252" y1="92" x2="298" y2="92" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
<rect x="300" y="60" width="160" height="64" rx="10" fill="#fff8e6" stroke="#b45309" stroke-width="2.5"/>
<text x="380.0" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Canal de propagation</text>
<text x="380.0" y="150" text-anchor="middle" font-size="12.5" fill="#222">milieu ou support où</text>
<text x="380.0" y="167" text-anchor="middle" font-size="12.5" fill="#222">l'onde se propage</text>
<line x1="462" y1="92" x2="508" y2="92" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
<rect x="510" y="60" width="130" height="64" rx="10" fill="#eef7ee" stroke="#2e7d32" stroke-width="2.5"/>
<text x="575.0" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Récepteur</text>
<text x="575.0" y="150" text-anchor="middle" font-size="12.5" fill="#222">capte l'onde et restitue</text>
<text x="575.0" y="167" text-anchor="middle" font-size="12.5" fill="#222">l'information</text>
<line x1="642" y1="92" x2="668" y2="92" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
<text x="712" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Information</text>
<text x="380" y="30" text-anchor="middle" font-size="14" fill="#222">Type d'onde : sonore, lumineuse ou électromagnétique</text>
<text x="380" y="200" text-anchor="middle" font-size="13" fill="#222">La structure émetteur → canal → récepteur est la même pour tous les systèmes.</text>
</svg>
