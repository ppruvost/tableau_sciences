<text x="526.8" y="392" font-size="17" text-anchor="middle" fill="#4B5563">Chauffer sur la plaque jusqu'à la</text>
<text x="526.8" y="414" font-size="17" text-anchor="middle" fill="#4B5563">température cible.</text>
<rect x="707.0" y="10" width="332.5" height="440" rx="26" fill="#FAFAFA" stroke="#D9D9D9" stroke-width="2"/>
<ellipse cx="749.0" cy="52" rx="19" ry="24" fill="#C1440E"/><text x="749.0" y="60" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<g><rect x="768.25" y="150" width="210" height="52" rx="10" fill="#FBE3DA" stroke="#4B5563" stroke-width="3"/><text x="873.25" y="183.0" font-size="20" text-anchor="middle" fill="#4B5563" font-weight="700">Δθ = θf − θi</text><line x1="873.25" y1="210" x2="873.25" y2="255" stroke="#C1440E" stroke-width="4" stroke-linecap="round"/><polygon points="873.2,255.0 867.2,242.4 879.3,242.4" fill="#C1440E"/><rect x="788.25" y="262" width="170" height="48" rx="10" fill="#DBEAFE" stroke="#4B5563" stroke-width="3"/><text x="873.25" y="293.0" font-size="20" text-anchor="middle" fill="#4B5563" font-weight="700">Δθ = 30 °C</text></g>
<text x="873.2" y="392" font-size="17" text-anchor="middle" fill="#4B5563">Calculer Δθ = T_finale −</text>
<text x="873.2" y="414" font-size="17" text-anchor="middle" fill="#4B5563">T_initiale.</text>
<rect x="1053.5" y="10" width="332.5" height="440" rx="26" fill="#FAFAFA" stroke="#D9D9D9" stroke-width="2"/>
<ellipse cx="1095.5" cy="52" rx="19" ry="24" fill="#C1440E"/><text x="1095.5" y="60" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<g><rect x="1109.75" y="130" width="220" height="52" rx="10" fill="#FBE3DA" stroke="#4B5563" stroke-width="3"/><text x="1219.75" y="163.0" font-size="20" text-anchor="middle" fill="#4B5563" font-weight="700">Q = m × c × Δθ</text><rect x="1129.75" y="205" width="180" height="44" rx="10" fill="#FBE3DA" stroke="#4B5563" stroke-width="3"/><text x="1219.75" y="234.0" font-size="20" text-anchor="middle" fill="#4B5563" font-weight="700">200 g → Q₁</text><rect x="1104.75" y="265" width="230" height="44" rx="10" fill="#DBEAFE" stroke="#4B5563" stroke-width="3"/><text x="1219.75" y="294.0" font-size="20" text-anchor="middle" fill="#4B5563" font-weight="700">400 g → Q₂ = 2 Q₁</text></g>
<text x="1219.8" y="392" font-size="17" text-anchor="middle" fill="#4B5563">Appliquer Q = m × c × Δθ et</text>
<text x="1219.8" y="414" font-size="17" text-anchor="middle" fill="#4B5563">comparer deux masses.</text>
