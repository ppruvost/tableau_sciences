<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="13">
<title id="titre">Règle du gamma : tableau des potentiels standard E° de couples oxydant/réducteur et axe de E° ; le métal le plus réducteur s'oxyde à l'anode, celui de E° le plus positif se réduit à la cathode</title>
<rect x="0" y="0" width="900" height="480" fill="#ffffff" stroke="none"/>

<text x="450.0" y="32.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8" stroke="none">RÈGLE DU GAMMA</text><rect x="60.0" y="44.0" width="780.0" height="46.0" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.5"/><text x="450.0" y="64.0" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">À 25 °C et 1 bar, dans une pile, le métal le plus réducteur (E° le plus négatif) s'oxyde (anode)</text><text x="450.0" y="80.0" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">et celui qui a le E° le plus positif se réduit (cathode).</text><rect x="60.0" y="104.0" width="330.0" height="32.0" rx="0" fill="#1d4ed8" stroke="currentColor" stroke-width="0"/><text x="160.0" y="126.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" stroke="none">Couple (Ox / Red)</text><text x="320.0" y="126.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" stroke="none">E° (V)</text><rect x="60.0" y="136.0" width="330.0" height="30.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/><text x="160.0" y="156.0" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">Mg²⁺ / Mg</text><text x="320.0" y="156.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">−2,37</text><rect x="60.0" y="166.0" width="330.0" height="30.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/><text x="160.0" y="186.0" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">Al³⁺ / Al</text><text x="320.0" y="186.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">−1,66</text><rect x="60.0" y="196.0" width="330.0" height="30.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/><text x="160.0" y="216.0" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">Zn²⁺ / Zn</text><text x="320.0" y="216.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">−0,76</text><rect x="60.0" y="226.0" width="330.0" height="30.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/><text x="160.0" y="246.0" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">Fe²⁺ / Fe</text><text x="320.0" y="246.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">−0,44</text><rect x="60.0" y="256.0" width="330.0" height="30.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/><text x="160.0" y="276.0" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">Ni²⁺ / Ni</text><text x="320.0" y="276.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">−0,26</text><rect x="60.0" y="286.0" width="330.0" height="30.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/><text x="160.0" y="306.0" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">Sn²⁺ / Sn</text><text x="320.0" y="306.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">−0,14</text><rect x="60.0" y="316.0" width="330.0" height="30.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/><text x="160.0" y="336.0" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">Pb²⁺ / Pb</text><text x="320.0" y="336.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">−0,13</text><rect x="60.0" y="346.0" width="330.0" height="30.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/><text x="160.0" y="366.0" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">H⁺ / H₂</text><text x="320.0" y="366.0" text-anchor="middle" font-size="13" font-weight="700" fill="#4f9d5d" stroke="none">0,00</text><rect x="60.0" y="376.0" width="330.0" height="30.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/><text x="160.0" y="396.0" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">Cu²⁺ / Cu</text><text x="320.0" y="396.0" text-anchor="middle" font-size="13" font-weight="700" fill="#d9534f" stroke="none">0,34</text><rect x="60.0" y="406.0" width="330.0" height="30.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/><text x="160.0" y="426.0" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">Ag⁺ / Ag</text><text x="320.0" y="426.0" text-anchor="middle" font-size="13" font-weight="700" fill="#d9534f" stroke="none">0,80</text><rect x="60.0" y="436.0" width="330.0" height="30.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/><text x="160.0" y="456.0" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" stroke="none">Au³⁺ / Au</text><text x="320.0" y="456.0" text-anchor="middle" font-size="13" font-weight="700" fill="#d9534f" stroke="none">1,50</text><line x1="520.0" y1="154.0" x2="520.0" y2="436.0" stroke="currentColor" stroke-width="3"/><line x1="520.0" y1="295.0" x2="520.0" y2="152.0" stroke="#2f6fb5" stroke-width="3"/><polygon points="520.0,140.0 514.0,152.0 526.0,152.0" fill="#2f6fb5" stroke="none"/><line x1="520.0" y1="295.0" x2="520.0" y2="438.0" stroke="#d9534f" stroke-width="3"/><polygon points="520.0,450.0 526.0,438.0 514.0,438.0" fill="#d9534f" stroke="none"/><line x1="514.0" y1="158.6" x2="526.0" y2="158.6" stroke="currentColor" stroke-width="1.5"/><text x="508.0" y="162.6" text-anchor="end" font-size="11" fill="currentColor" stroke="none">−2,5</text><line x1="514.0" y1="185.9" x2="526.0" y2="185.9" stroke="currentColor" stroke-width="1.5"/><text x="508.0" y="189.9" text-anchor="end" font-size="11" fill="currentColor" stroke="none">−2,0</text><line x1="514.0" y1="213.2" x2="526.0" y2="213.2" stroke="currentColor" stroke-width="1.5"/><text x="508.0" y="217.2" text-anchor="end" font-size="11" fill="currentColor" stroke="none">−1,5</text><line x1="514.0" y1="240.4" x2="526.0" y2="240.4" stroke="currentColor" stroke-width="1.5"/><text x="508.0" y="244.4" text-anchor="end" font-size="11" fill="currentColor" stroke="none">−1,0</text><line x1="514.0" y1="267.7" x2="526.0" y2="267.7" stroke="currentColor" stroke-width="1.5"/><text x="508.0" y="271.7" text-anchor="end" font-size="11" fill="currentColor" stroke="none">−0,5</text><line x1="514.0" y1="289.0" x2="526.0" y2="289.0" stroke="currentColor" stroke-width="1.5"/><text x="508.0" y="293.0" text-anchor="end" font-size="11" fill="currentColor" stroke="none">0,0</text><line x1="514.0" y1="322.3" x2="526.0" y2="322.3" stroke="currentColor" stroke-width="1.5"/><text x="508.0" y="326.3" text-anchor="end" font-size="11" fill="currentColor" stroke="none">+0,5</text><line x1="514.0" y1="349.6" x2="526.0" y2="349.6" stroke="currentColor" stroke-width="1.5"/><text x="508.0" y="353.6" text-anchor="end" font-size="11" fill="currentColor" stroke="none">+1,0</text><line x1="514.0" y1="376.8" x2="526.0" y2="376.8" stroke="currentColor" stroke-width="1.5"/><text x="508.0" y="380.8" text-anchor="end" font-size="11" fill="currentColor" stroke="none">+1,5</text><text x="520.0" y="128.0" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" stroke="none">E° (V)</text><text x="700.0" y="200.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">E° négatif</text><text x="700.0" y="219.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">Métaux réducteurs</text><text x="700.0" y="238.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">Tendance à s'oxyder (anode)</text><text x="700.0" y="300.0" text-anchor="middle" font-size="11.5" fill="#4f9d5d" stroke="none">E° = 0,00 V</text><text x="700.0" y="316.0" text-anchor="middle" font-size="11.5" fill="#4f9d5d" stroke="none">Électrode standard</text><text x="700.0" y="332.0" text-anchor="middle" font-size="11.5" fill="#4f9d5d" stroke="none">à hydrogène (ESH) : H⁺ / H₂</text><text x="700.0" y="390.0" text-anchor="middle" font-size="13" font-weight="700" fill="#d9534f" stroke="none">E° positif</text><text x="700.0" y="409.0" text-anchor="middle" font-size="13" font-weight="700" fill="#d9534f" stroke="none">Espèces oxydantes</text><text x="700.0" y="428.0" text-anchor="middle" font-size="13" font-weight="700" fill="#d9534f" stroke="none">Tendance à se réduire (cathode)</text>

