<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="13">
<title id="titre">Tableau des réactions d'estérification : quatre acides carboxyliques et quatre alcools, équations, esters formés et odeurs caractéristiques</title>
<rect x="0" y="0" width="1000" height="640" fill="#ffffff" stroke="none"/>

<text x="500.0" y="26.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8" stroke="none">RÉACTIONS D'ESTÉRIFICATION</text><text x="500.0" y="46.0" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">Réaction lente, limitée et athermique : accélérée par un catalyseur (quelques gouttes d'acide sulfurique concentré) et par le chauffage à reflux.</text><rect x="240.0" y="54.0" width="520.0" height="28.0" rx="5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.5"/><text x="500.0" y="73.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor" stroke="none">Acide carboxylique R–COOH + Alcool R'–OH ⇌ Ester R–COO–R' + Eau H₂O</text><rect x="10.0" y="90.0" width="980.0" height="26.0" rx="0" fill="#1d4ed8" stroke="currentColor" stroke-width="0"/><text x="85.0" y="108.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" stroke="none">Acide carboxylique</text><text x="225.0" y="108.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" stroke="none">Alcool</text><text x="330.0" y="108.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" stroke="none">Formule</text><text x="500.0" y="108.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" stroke="none">Équation d'estérification</text><text x="730.0" y="108.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" stroke="none">Ester formé</text><text x="910.0" y="108.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" stroke="none">Odeur</text><rect x="10.0" y="116.0" width="980.0" height="120.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/><text x="85.0" y="166.0" text-anchor="middle" font-size="11" font-weight="700" fill="#d9534f" stroke="none">Acide</text><text x="85.0" y="179.0" text-anchor="middle" font-size="11" font-weight="700" fill="#d9534f" stroke="none">méthanoïque</text><text x="85.0" y="192.0" text-a