lution titrante)</text><line x1="176.0" y1="230.0" x2="210.0" y2="200.0" stroke="currentColor" stroke-width="1"/><text x="215.0" y="200.0" text-anchor="start" font-size="11" fill="currentColor" stroke="none">Électrode de pH-mètre</text><line x1="210.0" y1="262.0" x2="240.0" y2="262.0" stroke="currentColor" stroke-width="1"/><text x="245.0" y="266.0" text-anchor="start" font-size="11" fill="currentColor" stroke="none">Bécher (solution)</text><text x="230.0" y="334.0" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">Agitateur magnétique + barreau aimanté</text><rect x="455.0" y="40.0" width="435.0" height="90.0" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><text x="465.0" y="59.0" text-anchor="start" font-size="13" font-weight="700" fill="#1d4ed8" stroke="none">② Ajout progressif de la solution titrante</text><text x="468.0" y="78.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">Ouvrir le robinet de la burette.</text><text x="468.0" y="92.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">Verser peu à peu, goutte à goutte</text><text x="468.0" y="106.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">à l'approche de l'équivalence.</text><text x="468.0" y="120.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">Agitation constante.</text><rect x="455.0" y="138.0" width="435.0" height="76.0" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><text x="465.0" y="157.0" text-anchor="start" font-size="13" font-weight="700" fill="#1d4ed8" stroke="none">③ Stabilisation du pH-mètre</text><text x="468.0" y="176.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">Attendre la stabilisation de la</text><text x="468.0" y="190.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">mesure : variation du pH &lt; 0,01</text><text x="468.0" y="204.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">pendant quelques secondes.</text><rect x="455.0" y="222.0" width="435.0" height="90.0" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><text x="465.0" y="241.0" text-anchor="start" font-size="13" font-weight="700" fill="#1d4ed8" stroke="none">④ Relevé de la mesure</text><text x="468.0" y="260.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">Relever la valeur affichée</text><text x="468.0" y="274.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">par le pH-mètre.</text><text x="468.0" y="288.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">Noter le volume versé</text><text x="468.0" y="302.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">(lecture sur la burette).</text><rect x="455.0" y="320.0" width="435.0" height="76.0" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><text x="465.0" y="339.0" text-anchor="start" font-size="13" font-weight="700" fill="#1d4ed8" stroke="none">⑤ Saisie dans le tableau de données</text><text x="468.0" y="358.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">V (mL) | pH :  0,0 | 2,20</text><text x="468.0" y="372.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">2,0 | 2,45 ;  4,0 | 2,70</text><text x="468.0" y="386.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">… ;  18,0 | 11,65</text><rect x="10.0" y="352.0" width="430.0" height="200.0" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><text x="20.0" y="371.0" text-anchor="start" font-size="13" font-weight="700" fill="#1d4ed8" stroke="none">⑥ Création de la courbe de titrage</text><line x1="60.0" y1="382.0" x2="60.0" y2="512.0" stroke="currentColor" stroke-width="2"/><line x1="60.0" y1="512.0" x2="410.0" y2="512.0" stroke="currentColor" stroke-width="2"/><text x