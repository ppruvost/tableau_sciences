<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="13">
<title id="titre">Protection d'un métal par anode sacrificielle : un bloc de zinc relié par un fil à une coque en acier dans un électrolyte, le zinc s'oxyde à la place du fer</title>
<rect x="0" y="0" width="900" height="470" fill="#ffffff" stroke="none"/>

<text x="450.0" y="24.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" stroke="none">Protection d'un métal par anode sacrificielle</text><rect x="20.0" y="44.0" width="380.0" height="56.0" rx="6" fill="none" stroke="#e8912d" stroke-width="1.5"/><text x="210.0" y="66.0" text-anchor="middle" font-size="12" fill="#e8912d" stroke="none">Oxydation à l'anode :</text><text x="210.0" y="88.0" text-anchor="middle" font-size="14" font-weight="700" fill="#e8912d" stroke="none">Zn(s) → Zn²⁺(aq) + 2 e⁻</text><rect x="500.0" y="44.0" width="380.0" height="56.0" rx="6" fill="none" stroke="#2f6fb5" stroke-width="1.5"/><text x="690.0" y="66.0" text-anchor="middle" font-size="12" fill="#2f6fb5" stroke="none">Réduction (métal protégé) :</text><text x="690.0" y="88.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fb5" stroke="none">O₂ + 2 H₂O + 4 e⁻ → 4 HO⁻</text><rect x="20.0" y="160.0" width="860.0" height="230.0" rx="6" fill="#dbeaf6" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.5"/><text x="450.0" y="184.0" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">Électrolyte (eau de mer, sol humide, …)</text><rect x="90.0" y="260.0" width="130.0" height="110.0" rx="0" fill="#c8743c" stroke="currentColor" stroke-width="2"/><text x="155.0" y="322.0" text-anchor="middle" font-size="20" font-weight="700" fill="#fff" stroke="none">Zn</text><text x="155.0" y="234.0" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" stroke="none">Anode sacrificielle</text><text x="155.0" y="248.0" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" stroke="none">(ex. Zn ou Mg)</text><rect x="520.0" y="260.0" width="300.0" height="110.0" rx="0" fill="#6b7886" stroke="currentColor" stroke-width="2"/><text x="670.0" y="322.0" text-anchor="middle" font-size="20" font-weight="700" fill="#fff" stroke="none">Fe</text><text x="670.0" y="234.0" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" stroke="none">Métal à protéger</text><text x="670.0" y="248.0" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" stroke="none">(ex. coque en acier)</text><path d="M155 260V120H670V260" fill="none" stroke="#d9534f" stroke-width="2.5" /><line x1="380.0" y1="120.0" x2="431.0" y2="120.0" stroke="#d9534f" stroke-width="2.5"/><polygon points="440.0,120.0 431.0,115.5 431.0,124.5" fill="#d9534f" stroke="none"/><text x="410.0" y="110.0" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">conducteur métallique (fil)</text><text x="410.0" y="140.0" text-anchor="middle" font-size="12" font-weight="700" fill="#d9534f" stroke="none">e⁻ cédés par Zn</text><rect x="20.0" y="408.0" width="860.0" height="44.0" rx="6" fill="#1d3557" stroke="currentColor" stroke-width="0"/><text x="450.0" y="436.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" stroke="none">L'anode, plus réductrice, s'oxyde à la place du métal : elle se consomme et protège le métal principal.</text>

</svg>
