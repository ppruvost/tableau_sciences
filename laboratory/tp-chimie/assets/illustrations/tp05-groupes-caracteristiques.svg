<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="13">
<title id="titre">Tableau des cinq familles de composés organiques étudiées : alcool, aldéhyde, cétone, acide carboxylique et ester, avec leur groupe caractéristique, un exemple et la formule du groupe</title>
<rect x="0" y="0" width="1000" height="470" fill="#ffffff" stroke="none"/>

<rect x="10.0" y="10.0" width="980.0" height="34.0" rx="0" fill="#1d4ed8" stroke="currentColor" stroke-width="0"/><text x="90.0" y="32.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" stroke="none">Fonction</text><text x="270.0" y="32.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" stroke="none">Groupe caractéristique</text><text x="470.0" y="32.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" stroke="none">Exemple</text><text x="780.0" y="32.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" stroke="none">Formule développée du groupe</text><rect x="10.0" y="44.0" width="980.0" height="84.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/><text x="90.0" y="92.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fb5" stroke="none">Alcool</text><text x="270.0" y="92.0" text-anchor="middle" font-size="15" font-weight="700" fill="#d9534f" stroke="none">–OH</text><text x="470.0" y="84.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">éthanol</text><text x="470.0" y="104.0" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">(CH₃CH₂OH)</text><text x="780.0" y="92.0" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">R–CH₂–OH</text><rect x="10.0" y="128.0" width="980.0" height="84.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/><text x="90.0" y="176.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fb5" stroke="none">Aldéhyde</text><text x="270.0" y="176.0" text-anchor="middle" font-size="15" font-weight="700" fill="#d9534f" stroke="none">–CHO</text><text x="470.0" y="168.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">éthanal</text><text x="470.0" y="188.0" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">(CH₃CHO)</text><text x="780.0" y="176.0" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">R–CH=O  (en bout de chaîne)</text><rect x="10.0" y="212.0" width="980.0" height="84.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/><text x="90.0" y="260.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fb5" stroke="none">Cétone</text><text x="270.0" y="260.0" text-anchor="middle" font-size="15" font-weight="700" fill="#d9534f" stroke="none">C=O (interne)</text><text x="470.0" y="252.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">propanone</text><text x="470.0" y="272.0" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">(CH₃COCH₃)</text><text x="780.0" y="260.0" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">R–C(=O)–R'</text><rect x="10.0" y="296.0" width="980.0" height="84.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/><text x="90.0" y="344.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fb5" stroke="none">Acide carboxylique</text><text x="270.0" y="344.0" text-anchor="middle" font-size="15" font-weight="700" fill="#d9534f" stroke="none">–COOH</text><text x="470.0" y="336.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">acide éthanoïque</text><text x="470.0" y="356.0" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">(CH₃COOH)</text><text x="780.0" y="344.0" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">R–C(=O)–OH</text><rect x="10.0" y="380.0" width="980.0" height="84.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/><text x="90.0" y="428.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fb5" stroke="none">Ester</text><text x="270.0" y="428.0" text-anchor="middle" font-size="15" font-weight="700" fill="#d9534f" stroke="none">–COO–</text><text x="470.0" y="420.0" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fb5" stroke="none">éthanoate d'éthyle</text><text x="470.0" y="440.0" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">(CH₃COOC₂H₅)</text><text x="780.0" y="428.0" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">R–C(=O)–O–R'</text><line x1="180.0" y1="10.0" x2="180.0" y2="464.0" stroke="currentColor" stroke-width="1"/><line x1="360.0" y1="10.0" x2="360.0" y2="464.0" stroke="currentColor" stroke-width="1"/><line x1="600.0" y1="10.0" x2="600.0" y2="464.0" stroke="currentColor" stroke-width="1"/>

