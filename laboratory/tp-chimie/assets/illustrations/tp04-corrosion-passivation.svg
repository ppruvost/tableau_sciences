<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="13">
<title id="titre">Comparaison de la corrosion active, avec un oxyde poreux non protecteur, et de la passivation, avec une fine couche d'oxyde adhérente et protectrice</title>
<rect x="0" y="0" width="900" height="470" fill="#ffffff" stroke="none"/>

<text x="450.0" y="24.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" stroke="none">Corrosion et passivation des métaux</text><text x="450.0" y="48.0" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">Certains métaux se corrodent activement à l'air humide (oxyde poreux, non protecteur), tandis que d'autres se</text><text x="450.0" y="63.0" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">recouvrent d'une fine couche d'oxyde adhérente qui stoppe toute corrosion ultérieure : c'est la passivation.</text><rect x="10.0" y="86.0" width="430.0" height="370.0" rx="8" fill="none" stroke="#d9534f" stroke-width="1.5" stroke-opacity="0.4"/><rect x="70.0" y="96.0" width="310.0" height="26.0" rx="6" fill="#d9534f" stroke="currentColor" stroke-width="0"/><text x="225.0" y="114.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" stroke="none">CORROSION ACTIVE</text><text x="225.0" y="140.0" text-anchor="middle" font-size="12" font-weight="700" fill="#d9534f" stroke="none">oxyde poreux, non protecteur</text><text x="70.0" y="178.0" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">Air humide</text><text x="200.0" y="178.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fb5" stroke="none">O₂</text><text x="260.0" y="178.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fb5" stroke="none">O₂</text><line x1="200.0" y1="184.0" x2="200.0" y2="216.0" stroke="#2f6fb5" stroke-width="1.8"/><polygon points="200.0,222.0 203.0,216.0 197.0,216.0" fill="#2f6fb5" stroke="none"/><line x1="260.0" y1="184.0" x2="260.0" y2="216.0" stroke="#2f6fb5" stroke-width="1.8"/><polygon points="260.0,222.0 263.0,216.0 257.0,216.0" fill="#2f6fb5" stroke="none"/><path d="M60 232C90 220 120 240 160 226C200 214 240 240 280 224C320 214 350 232 390 230V260H60Z" fill="#b5652a" stroke="currentColor" stroke-width="1.5" /><circle cx="80.0" cy="238.0" r="3" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><circle cx="102.0" cy="244.0" r="4" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><circle cx="124.0" cy="250.0" r="3" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><circle cx="146.0" cy="238.0" r="4" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><circle cx="168.0" cy="244.0" r="3" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><circle cx="190.0" cy="250.0" r="4" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><circle cx="212.0" cy="238.0" r="3" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><circle cx="234.0" cy="244.0" r="4" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><circle cx="256.0" cy="250.0" r="3" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><circle cx="278.0" cy="238.0" r="4" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><circle cx="300.0" cy="244.0" r="3" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><circle cx="322.0" cy="250.0" r="4" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><circle cx="344.0" cy="238.0" r="3" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><circle cx="366.0" cy="244.0" r="4" fill="#7a3a14" stroke="currentColor" stroke-width="0"/><rect x="60.0" y="260.0" width="330.0" height="70.0" rx="0" fill="#7c858f" stroke="currentColor" stroke-width="1.5"/><line x1="120.0" y1="330.0" x2="120.0" y2="366.0" stroke="#e8912d" stroke-width="1.8"/><polygon points="120.0,372.0 123.0,366.0 117.0,366.0" fill="#e8912d" stroke="none"/><line x1="230.0" y1="330.0" x2="230.0" y2="366.0" stroke="#e8912d" stroke-width="1.8"/><polygon points="230.0,372.0 233.0,366.0 227.0,366.0" fill="#e8912d" stroke="none"/><line x1="340.0" y1="330.0" x2="340.0" y2="366.0" stroke="#e8912d" stroke-width="1.8"/><polygon points="340.0,372.0 343.0,366.0 337.0,366.0" fill="#e8912d" stroke="none"/><text x="225.0" y="390.0" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">Mⁿ⁺ (ions métalliques)</text><rect x="30.0" y="398.0" width="390.0" height="46.0" rx="6" fill="#fde8e0" stroke="currentColor" stroke-width="0"/><text x="225.0" y="416.0" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">L'eau et l'oxygène pénètrent à travers l'oxyde poreux : le</text><text x="225.0" y="430.0" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">métal continue de se corroder.</text><rect x="460.0" y="86.0" width="430.0" height="370.0" rx="8" fill="none" stroke="#4f9d5d" stroke-width="1.5" stroke-opacity="0.4"/><rect x="520.0" y="96.0" width="310.0" height="26.0" rx="6" fill="#4f9d5d" stroke="currentColor" stroke-width="0"/><text x="675.0" y="114.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" stroke="none">PASSIVATION</text><text x="675.0" y="140.0" text-anchor="middle" font-size="12" font-weight="700" fill="#4f9d5d" stroke="none">oxyde fin, adhérent et protecteur</text><text x="520.0" y="178.0" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">Air humide</text><text x="650.0" y="178.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fb5" stroke="none">O₂</text><text x="710.0" y="178.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fb5" stroke="none">O₂</text><line x1="650.0" y1="184.0" x2="650.0" y2="216.0" stroke="#2f6fb5" stroke-width="1.8"/><polygon points="650.0,222.0 653.0,216.0 647.0,216.0" fill="#2f6fb5" stroke="none"/><line x1="710.0" y1="184.0" x2="710.0" y2="216.0" stroke="#2f6fb5" stroke-width="1.8"/><polygon points="710.0,222.0 713.0,216.0 707.0,216.0" fill="#2f6fb5" stroke="none"/><rect x="510.0" y="232.0" width="330.0" height="8.0" rx="0" fill="#6fae6a" stroke="currentColor" stroke-width="1"/><rect x="510.0" y="240.0" width="330.0" height="90.0" rx="0" fill="#7c858f" stroke="currentColor" stroke-width="1.5"/><text x="790.0" y="222.0" text-anchor="middle" font-size="10" fill="#4f9d5d" stroke="none">Fine couche</text><text x="790.0" y="233.0" text-anchor="middle" font-size="10" fill="#4f9d5d" stroke="none">adhérente</text><rect x="480.0" y="398.0" width="390.0" height="46.0" rx="6" fill="#e4f2e4" stroke="currentColor" stroke-width="0"/><text x="675.0" y="416.0" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">L'oxyde adhérent et imperméable bloque l'accès de l'eau et</text><text x="675.0" y="430.0" text-anchor="middle" font-size="11.5" fill="currentColor" stroke="none">de l'oxygène : la corrosion s'arrête.</text>

</svg>
