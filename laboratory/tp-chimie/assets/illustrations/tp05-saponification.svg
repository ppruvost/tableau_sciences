<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="13">
<title id="titre">Tableau des réactions de saponification : esters hydrolysés par la soude, carboxylates de sodium formés et alcools régénérés</title>
<rect x="0" y="0" width="1000" height="650" fill="#ffffff" stroke="none"/>

<text x="500.0" y="26.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" stroke="none">RÉACTIONS DE SAPONIFICATION (HYDROLYSE BASIQUE DES ESTERS)</text><rect x="160.0" y="38.0" width="680.0" height="30.0" rx="5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.5"/><text x="500.0" y="58.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor" stroke="none">Ester R–COO–R' + Na⁺ + HO⁻ → Carboxylate de sodium R–COO⁻ , Na⁺ + Alcool R'–OH</text><rect x="10.0" y="76.0" width="980.0" height="26.0" rx="0" fill="#1d4ed8" stroke="currentColor" stroke-width="0"/><text x="100.0" y="94.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" stroke="none">Acide carboxylique</text><text x="240.0" y="94.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" stroke="none">Alcool</text><text x="420.0" y="94.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" stroke="none">Ester hydrolysé</text><text x="700.0" y="94.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" stroke="none">Équation (saponification)</text><text x="940.0" y="94.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" stroke="none">Alcool</text><rect x="10.0" y="102.0" width="980.0" height="136.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/><text x="100.0" y="162.0" text-anchor="middle" font-size="11" font-weight="700" fill="#d9534f" stroke="none">Acide méthanoïque</text><text x="100.0" y="175.0" text-anchor="middle" font-size="11" font-weight="700" fill="#d9534f" stroke="none">(formique)</text><text x="240.0" y="123.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">Méthanol</text><text x="420.0" y="116.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">méthanoate de méthyle</text><text x="420.0" y="130.0" text-anchor="middle" font-size="9" fill="currentColor" stroke="none">(HCOOCH₃)</text><text x="700.0" y="123.0" text-anchor="middle" font-size="9.5" fill="currentColor" stroke="none">HCOOCH₃ + Na⁺ + HO⁻ → HCOO⁻ , Na⁺ + CH₃OH</text><text x="940.0" y="123.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a3fa0" stroke="none">CH₃OH</text><line x1="180.0" y1="136.0" x2="990.0" y2="136.0" stroke="currentColor" stroke-width="0.8"/><text x="240.0" y="157.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">Éthanol</text><text x="420.0" y="150.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">méthanoate d'éthyle</text><text x="420.0" y="164.0" text-anchor="middle" font-size="9" fill="currentColor" stroke="none">(HCOOC₂H₅)</text><text x="700.0" y="157.0" text-anchor="middle" font-size="9.5" fill="currentColor" stroke="none">HCOOC₂H₅ + Na⁺ + HO⁻ → HCOO⁻ , Na⁺ + C₂H₅OH</text><text x="940.0" y="157.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a3fa0" stroke="none">C₂H₅OH</text><line x1="180.0" y1="170.0" x2="990.0" y2="170.0" stroke="currentColor" stroke-width="0.8"/><text x="240.0" y="191.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">Propan-1-ol</text><text x="420.0" y="184.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">méthanoate de propyle</text><text x="420.0" y="198.0" text-anchor="middle" font-size="9" fill="currentColor" stroke="none">(HCOOC₃H₇)</text><text x="700.0" y="191.0" text-anchor="middle" font-size="9.5" fill="currentColor" stroke="none">HCOOC₃H₇ + Na⁺ + HO⁻ → HCOO⁻ , Na⁺ + C₃H₇OH</text><text x="940.0" y="191.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a3fa0" stroke="none">C₃H₇OH</text><line x1="180.0" y1="204.0" x2="990.0" y2="204.0" stroke="currentColor" stroke-width="0.8"/><text x="240.0" y="225.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">Alcool isoamylique</text><text x="420.0" y="218.0" text-anchor="middle" font-size="10.5" fill="currentColor" 