 x2="990.0" y2="476.0" stroke="currentColor" stroke-width="0.8"/><text x="240.0" y="497.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">Alcool isoamylique</text><text x="420.0" y="490.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">propanoate d'isoamyle</text><text x="420.0" y="504.0" text-anchor="middle" font-size="9" fill="currentColor" stroke="none">(CH₃CH₂COOC₅H₁₁)</text><text x="700.0" y="497.0" text-anchor="middle" font-size="9.5" fill="currentColor" stroke="none">CH₃CH₂COOC₅H₁₁ + Na⁺ + HO⁻ → CH₃CH₂COO⁻ , Na⁺ + C₅H₁₁OH</text><text x="940.0" y="497.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a3fa0" stroke="none">C₅H₁₁OH</text><rect x="10.0" y="510.0" width="980.0" height="136.0" rx="0" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/><text x="100.0" y="570.0" text-anchor="middle" font-size="11" font-weight="700" fill="#d9534f" stroke="none">Acide butanoïque</text><text x="240.0" y="531.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">Méthanol</text><text x="420.0" y="524.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">butanoate de méthyle</text><text x="420.0" y="538.0" text-anchor="middle" font-size="9" fill="currentColor" stroke="none">(CH₃CH₂CH₂COOCH₃)</text><text x="700.0" y="531.0" text-anchor="middle" font-size="9.5" fill="currentColor" stroke="none">CH₃CH₂CH₂COOCH₃ + Na⁺ + HO⁻ → CH₃CH₂CH₂COO⁻ , Na⁺ + CH₃OH</text><text x="940.0" y="531.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a3fa0" stroke="none">CH₃OH</text><line x1="180.0" y1="544.0" x2="990.0" y2="544.0" stroke="currentColor" stroke-width="0.8"/><text x="240.0" y="565.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">Éthanol</text><text x="420.0" y="558.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">butanoate d'éthyle</text><text x="420.0" y="572.0" text-anchor="middle" font-size="9" fill="currentColor" stroke="none">(CH₃CH₂CH₂COOC₂H₅)</text><text x="700.0" y="565.0" text-anchor="middle" font-size="9.5" fill="currentColor" stroke="none">CH₃CH₂CH₂COOC₂H₅ + Na⁺ + HO⁻ → CH₃CH₂CH₂COO⁻ , Na⁺ + C₂H₅OH</text><text x="940.0" y="565.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a3fa0" stroke="none">C₂H₅OH</text><line x1="180.0" y1="578.0" x2="990.0" y2="578.0" stroke="currentColor" stroke-width="0.8"/><text x="240.0" y="599.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">Propan-1-ol</text><text x="420.0" y="592.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">butanoate de propyle</text><text x="420.0" y="606.0" text-anchor="middle" font-size="9" fill="currentColor" stroke="none">(CH₃CH₂CH₂COOC₃H₇)</text><text x="700.0" y="599.0" text-anchor="middle" font-size="9.5" fill="currentColor" stroke="none">CH₃CH₂CH₂COOC₃H₇ + Na⁺ + HO⁻ → CH₃CH₂CH₂COO⁻ , Na⁺ + C₃H₇OH</text><text x="940.0" y="599.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a3fa0" stroke="none">C₃H₇OH</text><line x1="180.0" y1="612.0" x2="990.0" y2="612.0" stroke="currentColor" stroke-width="0.8"/><text x="240.0" y="633.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">Alcool isoamylique</text><text x="420.0" y="626.0" text-anchor="middle" font-size="10.5" fill="currentColor" stroke="none">butanoate d'isoamyle</text><text x="420.0" y="640.0" text-anchor="middle" font-size="9" fill="currentColor" stroke="none">(CH₃CH₂CH₂COOC₅H₁₁)</text><text x="700.0" y="633.0" text-anchor="middle" font-size="9.5" fill="currentColor" stroke="none">CH₃CH₂CH₂COOC₅H₁₁ + Na⁺ + HO⁻ → CH₃CH₂CH₂COO⁻ , Na⁺ + C₅H₁₁OH</text><text x="940.0" y="633.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a3fa0" stroke="none">C₅H₁₁OH</text><rect x="10.0" y="654.0" width="980.0" height="40.0" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.5"/><text x="24.0" y="672.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">Contrairement à l'estérification, l'hydrolyse basique (saponification) est une réaction totale (non limitée) et exothermique. Elle régénère l'alcool correspondant (R'–OH).</text><text x="24.0" y="688.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#d9534f" stroke="none">Attention : la soude (NaOH) est corrosive. Porter des gants et des lunettes de protection.</text>

