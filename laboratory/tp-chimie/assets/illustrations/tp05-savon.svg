<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" color="#1f2937" role="img" aria-labelledby="titre" fill="none" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="13">
<title id="titre">Le savon : carboxylate de sodium à longue chaîne carbonée, structure amphiphile, exemples de savons, origine à partir des triglycérides et rôle nettoyant</title>
<rect x="0" y="0" width="1000" height="640" fill="#ffffff" stroke="none"/>

<text x="500.0" y="26.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" stroke="none">RÉACTIONS DE SAPONIFICATION : LE SAVON</text><rect x="10.0" y="40.0" width="980.0" height="44.0" rx="6" fill="#f2d36b" stroke="currentColor" stroke-width="0" stroke-opacity="0.35"/><text x="500.0" y="60.0" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">Lors d'une saponification, un ester réagit avec l'ion hydroxyde HO⁻ pour donner un alcool et le sel de sodium de l'acide :</text><text x="500.0" y="76.0" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">le carboxylate de sodium. C'est ce carboxylate qui est le « savon » lorsque la chaîne carbonée (R) est longue.</text><rect x="10.0" y="96.0" width="480.0" height="250.0" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><text x="20.0" y="115.0" text-anchor="start" font-size="13" font-weight="700" fill="#1d4ed8" stroke="none">Dans ces réactions, le savon c'est quoi exactement ?</text><text x="24.0" y="136.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">Le savon est le sel de sodium d'un acide carboxylique à longue chaîne</text><text x="24.0" y="151.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">carbonée (généralement 12 à 18 atomes de carbone). Il se forme pendant</text><text x="24.0" y="166.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">la saponification de triglycérides (huiles ou graisses) ou d'esters à</text><text x="24.0" y="181.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">longue chaîne.</text><path d="M30 250H300" fill="none" stroke="#2f6fb5" stroke-width="2.5" /><path d="M30 250l15 -14l15 14" fill="none" stroke="currentColor" stroke-width="2.5" /><path d="M60 250l15 -14l15 14" fill="none" stroke="currentColor" stroke-width="2.5" /><path d="M90 250l15 -14l15 14" fill="none" stroke="currentColor" stroke-width="2.5" /><path d="M120 250l15 -14l15 14" fill="none" stroke="currentColor" stroke-width="2.5" /><path d="M150 250l15 -14l15 14" fill="none" stroke="currentColor" stroke-width="2.5" /><path d="M180 250l15 -14l15 14" fill="none" stroke="currentColor" stroke-width="2.5" /><path d="M210 250l15 -14l15 14" fill="none" stroke="currentColor" stroke-width="2.5" /><path d="M240 250l15 -14l15 14" fill="none" stroke="currentColor" stroke-width="2.5" /><text x="30.0" y="236.0" text-anchor="start" font-size="12" font-weight="700" fill="currentColor" stroke="none">CH₃</text><text x="330.0" y="246.0" text-anchor="start" font-size="13" font-weight="700" fill="#d9534f" stroke="none">C(=O)O⁻ Na⁺</text><text x="140.0" y="282.0" text-anchor="middle" font-size="11" fill="#2f6fb5" stroke="none">queue hydrophobe (apolaire, lipophile)</text><text x="400.0" y="282.0" text-anchor="middle" font-size="11" fill="#d9534f" stroke="none">tête hydrophile (polaire)</text><text x="24.0" y="310.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">Cette molécule est amphiphile : une partie aime l'huile (hydrophobe) et</text><text x="24.0" y="325.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">une partie aime l'eau (hydrophile). C'est cette propriété qui permet au</text><text x="24.0" y="340.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">savon de nettoyer.</text><rect x="505.0" y="96.0" width="485.0" height="250.0" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><text x="515.0" y="115.0" text-anchor="start" font-size="13" font-weight="700" fill="#4f9d5d" stroke="none">Exemples de savons (issus d'acides gras)</text><line x1="515.0" y1="162.0" x2="980.0" y2="162.0" stroke="currentColor" stroke-width="0.8"/><text x="520.0" y="154.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">H₃C–(CH₂)₁₀–COO⁻ Na⁺</text><text x="980.0" y="176.0" text-anchor="end" font-size="11" font-weight="700" fill="#4f9d5d" stroke="none">Laurate de sodium (C₁₂)</text><line x1="515.0" y1="202.0" x2="980.0" y2="202.0" stroke="currentColor" stroke-width="0.8"/><text x="520.0" y="194.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">H₃C–(CH₂)₁₂–COO⁻ Na⁺</text><text x="980.0" y="216.0" text-anchor="end" font-size="11" font-weight="700" fill="#4f9d5d" stroke="none">Myristate de sodium (C₁₄)</text><line x1="515.0" y1="242.0" x2="980.0" y2="242.0" stroke="currentColor" stroke-width="0.8"/><text x="520.0" y="234.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">H₃C–(CH₂)₁₄–COO⁻ Na⁺</text><text x="980.0" y="256.0" text-anchor="end" font-size="11" font-weight="700" fill="#4f9d5d" stroke="none">Palmitate de sodium (C₁₆)</text><line x1="515.0" y1="282.0" x2="980.0" y2="282.0" stroke="currentColor" stroke-width="0.8"/><text x="520.0" y="274.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">H₃C–(CH₂)₁₆–COO⁻ Na⁺</text><text x="980.0" y="296.0" text-anchor="end" font-size="11" font-weight="700" fill="#4f9d5d" stroke="none">Stéarate de sodium (C₁₈)</text><line x1="515.0" y1="322.0" x2="980.0" y2="322.0" stroke="currentColor" stroke-width="0.8"/><text x="520.0" y="314.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">H₃C–(CH₂)₇–CH=CH–(CH₂)₇–COO⁻ Na⁺</text><text x="980.0" y="336.0" text-anchor="end" font-size="11" font-weight="700" fill="#4f9d5d" stroke="none">Oléate de sodium (insaturé, C₁₈)</text><rect x="10.0" y="358.0" width="480.0" height="130.0" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><text x="20.0" y="377.0" text-anchor="start" font-size="13" font-weight="700" fill="#1d4ed8" stroke="none">Pourquoi est-ce un savon ?</text><text x="24.0" y="398.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">✔ Le carboxylate de sodium est la partie active nettoyante.</text><text x="24.0" y="418.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">✔ Quand R est long (> 10 carbones), le produit est appelé « savon ».</text><text x="24.0" y="438.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">✔ Si R est court (1 à 4 C), le produit est un sel soluble, mais pas un savon.</text><rect x="505.0" y="358.0" width="485.0" height="130.0" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><text x="515.0" y="377.0" text-anchor="start" font-size="13" font-weight="700" fill="#1d4ed8" stroke="none">Rôle du savon</text><text x="520.0" y="398.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">Les queues hydrophobes s'enfoncent dans les graisses, les têtes</text><text x="520.0" y="415.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">hydrophiles restent dans l'eau : des micelles se forment, les graisses</text><text x="520.0" y="432.0" text-anchor="start" font-size="11.5" fill="currentColor" stroke="none">sont entourées et emportées par l'eau au rinçage.</text><circle cx="880.0" cy="440.0" r="22" fill="#dbeaf6" stroke="currentColor" stroke-width="1.5"/><text x="880.0" y="444.0" text-anchor="middle" font-size="9" fill="currentColor" stroke="none">graisse</text><line x1="910.0" y1="440.0" x2="902.0" y2="440.0" stroke="#d9534f" stroke-width="2"/><line x1="906.0" y1="455.0" x2="899.1" y2="451.0" stroke="#d9534f" stroke-width="2"/><line x1="895.0" y1="466.0" x2="891.0" y2="459.1" stroke="#d9534f" stroke-width="2"/><line x1="880.0" y1="470.0" x2="880.0" y2="462.0" stroke="#d9534f" stroke-width="2"/><line x1="865.0" y1="466.0" x2="869.0" y2="459.1" stroke="#d9534f" stroke-width="2"/><line x1="854.0" y1="455.0" x2="860.9" y2="451.0" stroke="#d9534f" stroke-width="2"/><line x1="850.0" y1="440.0" x2="858.0" y2="440.0" stroke="#d9534f" stroke-width="2"/><line x1="854.0" y1="425.0" x2="860.9" y2="429.0" stroke="#d9534f" stroke-width="2"/><line x1="865.0" y1="414.0" x2="869.0" y2="420.9" stroke="#d9534f" stroke-width="2"/><line x1="880.0" y1="410.0" x2="880.0" y2="418.0" stroke="#d9534f" stroke-width="2"/><line x1="895.0" y1="414.0" x2="891.0" y2="420.9" stroke="#d9534f" stroke-width="2"/><line x1="906.0" y1="425.0" x2="899.1" y2="429.0" stroke="#d9534f" stroke-width="2"/><rect x="10.0" y="500.0" width="980.0" height="70.0" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><text x="20.0" y="519.0" text-anchor="start" font-size="13" font-weight="700" fill="#1d4ed8" stroke="none">Origine des savons</text><text x="24.0" y="544.0" text-anchor="start" font-size="12.5" fill="currentColor" stroke="none">Triglycéride (huile ou graisse) + 3 NaOH → 3 savons (sels de sodium d'acides gras) + glycérol (propane-1,2,3-triol)</text><rect x="10.0" y="580.0" width="980.0" height="46.0" rx="6" fill="none" stroke="#d9534f" stroke-width="1.5"/><text x="24.0" y="600.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#d9534f" stroke="none">Sécurité : la soude (NaOH) est corrosive.</text><text x="24.0" y="618.0" text-anchor="start" font-size="12" fill="currentColor" stroke="none">Porter des gants et des lunettes de protection.</text>

</svg>
