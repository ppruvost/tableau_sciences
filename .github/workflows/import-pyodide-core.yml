name: Import pyodide core (one-off, sans historique)

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout tableau_sciences
        uses: actions/checkout@v4

      - name: Télécharger Pyodide core
        run: |
          mkdir -p /tmp/pyodide-core
          cd /tmp/pyodide-core
          curl -L -o pyodide-core.tar.bz2 https://github.com/pyodide/pyodide/releases/download/314.0.3/pyodide-core-314.0.3.tar.bz2
          tar xjf pyodide-core.tar.bz2

      - name: Copier les fichiers utiles dans /pyodide
        run: |
          mkdir -p pyodide
          rm -rf pyodide/*
          rm -rf pyodide/.[!.]* pyodide/..?* 2>/dev/null || true
          cp -r /tmp/pyodide-core/. pyodide/

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pyodide

          if git diff --cached --quiet; then
            echo "Rien à committer"
          else
            git commit -m "Import pyodide core (contenu actuel, sans historique)"
            git push
          fi
