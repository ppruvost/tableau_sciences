name: Import pyodide full (one-off, sans historique)

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout tableau_sciences
        uses: actions/checkout@v4

      - name: Télécharger Pyodide full
        run: |
          mkdir -p /tmp/pyodide-full
          cd /tmp/pyodide-full
          curl -L -o pyodide-full.tar.bz2 https://github.com/pyodide/pyodide/releases/download/314.0.3/pyodide-314.0.3.tar.bz2
          tar xjf pyodide-full.tar.bz2

      - name: Copier les fichiers utiles dans /pylab
        run: |
          mkdir -p pylab
          rm -rf pylab/*
          rm -rf pylab/.[!.]* pylab/..?* 2>/dev/null || true
          cp -r /tmp/pyodide-full/. pylab/

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pylab

          if git diff --cached --quiet; then
            echo "Rien à committer"
          else
            git commit -m "Import pyodide full dans pylab"
            git push
          fi
