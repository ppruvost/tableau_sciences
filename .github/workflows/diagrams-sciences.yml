            .item a {{ display: flex; flex-direction: column; align-items: center; gap: .35rem; background: #fff; border: 1px solid #e3e5e9; border-radius: 10px; padding: .7rem .5rem; text-decoration: none; color: #1a1a1a; font-size: .72rem; text-align: center; word-break: break-all; }}
            .item img {{ width: 40px; height: 40px; }}
