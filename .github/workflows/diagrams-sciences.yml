      # ==========================================================
      # 14. VÉRIFICATION DES FICHIERS
      # ==============================================================

      - name: Vérifier les fichiers XML
        run: |

          echo "=============================================="
          echo " MERMOZLAB - BIBLIOTHÈQUES DIAGRAMS.NET"
          echo "=============================================="

          find diagrams/libraries \
            -type f \
            | sort

          echo ""
          echo "=============================================="
          echo " VÉRIFICATION DES XML"
          echo "=============================================="

          files=$(find diagrams/libraries -type f -name "*.xml")

          if [ -z "$files" ]; then
            echo "ERREUR : aucune bibliothèque XML trouvée."
            exit 1
          fi

          for file in $files; do

            echo "Vérification : $file"

            test -s "$file" || {
              echo "ERREUR : fichier vide : $file"
              exit 1
            }

          done


      # ==========================================================
      # 15. VÉRIFICATION DES FICHIERS OBLIGATOIRES
      # ==============================================================

      - name: Vérifier les bibliothèques obligatoires
        run: |

          required_files=(

            "diagrams/libraries/electricite/logic_gates.xml"
            "diagrams/libraries/electricite/resistors.xml"
            "diagrams/libraries/electricite/capacitors.xml"
            "diagrams/libraries/electricite/inductors.xml"
            "diagrams/libraries/electricite/diodes.xml"
            "diagrams/libraries/electricite/signal_sources.xml"
            "diagrams/libraries/electricite/instruments.xml"
            "diagrams/libraries/electricite/waveforms.xml"
            "diagrams/libraries/electricite/transistors.xml"
            "diagrams/libraries/electricite/mosfets1.xml"
            "diagrams/libraries/electricite/mosfets2.xml"
            "diagrams/libraries/electricite/opto_electronics.xml"
            "diagrams/libraries/electricite/electro-mechanical.xml"
            "diagrams/libraries/electricite/switchesRelays.xml"

            "diagrams/libraries/electricite/OwnTech-circuit.xml"
            "diagrams/libraries/electricite/Custom-Electrical.xml"

            "diagrams/libraries/manifest.json"
            "diagrams/libraries/SOURCES.md"
            "diagrams/docs/couverture-bac-pro.md"
          )

          for file in "${required_files[@]}"; do

            if [ ! -s "$file" ]; then

              echo "ERREUR : fichier manquant : $file"
              exit 1

            fi

            echo "OK : $file"

          done


      # ==========================================================
      # 16. INFORMATIONS DE FIN
      # ==============================================================

      - name: Résumé
        run: |

          echo ""
          echo "=============================================="
          echo " MERMOZLAB - INSTALLATION TERMINÉE"
          echo "=============================================="
          echo ""

          echo "Bibliothèques électriques :"
          find diagrams/libraries/electricite \
            -maxdepth 1 \
            -type f \
            -name "*.xml" \
            -printf "  ✓ %f\n"

          echo ""
          echo "Architecture scientifique :"
          echo "  ✓ Électricité"
          echo "  ✓ Énergie"
          echo "  ✓ Mécanique"
          echo "  ✓ Acoustique"
          echo "  ✓ Optique"
          echo "  ✓ Ondes et signaux"
          echo "  ✓ Chimie"
          echo "  ✓ Verrerie"
          echo "  ✓ Mesures"
          echo "  ✓ Sécurité"

          echo ""
          echo "Les ressources de chimie/verrerie restent"
          echo "séparées afin de permettre l'ajout ultérieur"
          echo "de ressources SVG dont la licence est vérifiée."


      # ==========================================================
      # 17. COMMIT AUTOMATIQUE
      # ==============================================================

      - name: Enregistrer les bibliothèques
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add diagrams/

          if git diff --cached --quiet; then

            echo "Aucune modification à enregistrer."

          else

            git commit \
              -m "Ajout des bibliothèques sciences BAC Pro MermozLab"

            git push

          fi
