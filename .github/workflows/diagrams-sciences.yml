          ## Acoustique

          - Source sonore
          - Haut-parleur
          - Microphone
          - Sonomètre
          - Signal périodique
          - Onde sonore

          ## Optique

          - Source lumineuse
          - Rayon lumineux
          - Faisceau
          - Miroir
          - Lentille convergente
          - Lentille divergente
          - Écran
          - Objet
          - Image
          - Œil
          - Fibre optique

          ## Énergie

          - Générateur
          - Moteur
          - Transformateur
          - Conversion d'énergie
          - Chaîne énergétique

          EOF


      # ==========================================================
      # 11. INSTRUMENTATION
      # ==============================================================

      - name: Préparer les instruments
        run: |

          cat > diagrams/libraries/instruments/README.md <<'EOF'
          # Instruments MermozLab

          ## Électricité

