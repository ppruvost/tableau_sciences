      # ==========================================================
      # 16. GÉNÉRER LES STYLES COMMUNS (assets/style.css)
      #
      # Feuille de style partagée par index.html et editor.html,
      # reprenant la charte graphique commune SciLab / MathiLab
      # (laboratory/css/global.css, laboratory/style.css) : polices
      # Space Grotesk / Lato / Fira Code, une couleur par domaine
      # de TP.
      # ==========================================================

      - name: Générer les styles communs (assets/style.css)
        run: |

          mkdir -p diagrams/assets

          cat > diagrams/assets/style.css <<'EOF'
          /* ════════════════════════════════════════════════════════════════
             assets/style.css — MermozLab / Bibliothèques sciences
             Reprend la charte graphique commune SciLab / MathiLab :
             voir laboratory/css/global.css et laboratory/style.css.
             Les valeurs sont recopiées ici en dur pour que ce module reste
             autonome (cf. commentaire dans laboratory/style.css : "Chaque
             tp-<domaine>/css/style.css doit utiliser exactement ces mêmes
             teintes").
             ════════════════════════════════════════════════════════════════ */

          @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Fira+Code:wght@400;500&family=Lato:wght@300;400;700&display=swap');

          :root {
            --bleu-cuivre:   #1B6CA8;
            --bleu-fonce:    #0D4F8A;
            --bleu-clair-bg: #EAF2F8;
            --gris-ardoise:  #2C3E50;
            --gris-moyen:    #566573;
            --gris-texte-clair: #6B7280;
            --gris-clair:    #D5D8DC;
            --blanc-paillasse: #F8F9FA;
