name: MermozLab - Bibliothèques scientifiques diagrams.net

# ==============================================================
# MERMOZLAB / TABLEAU SCIENCES
#
# Bibliothèques utiles aux schémas de physique-chimie BAC Pro.
#
# Domaines :
#   - Électricité
#   - Énergie
#   - Mécanique
#   - Acoustique
#   - Optique
#   - Ondes et signaux
#   - Chimie
#   - Verrerie
#   - Mesures / instrumentation
#   - Sécurité
#
# IMPORTANT :
# Ce workflow ne télécharge PAS tout diagrams.net.
# Il récupère uniquement les bibliothèques utiles.
# ==============================================================

on:

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/diagrams-sciences.yml"


permissions:
  contents: write


jobs:

  install-sciences-libraries:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. RÉCUPÉRATION DU PROJET
      # ==========================================================

      - name: Récupérer MermozLab
        uses: actions/checkout@v4


      # ==========================================================
      # 2. ARBORESCENCE
      # ==========================================================

      - name: Créer l'arborescence
        run: |

          mkdir -p diagrams/libraries/electricite
          mkdir -p diagrams/libraries/physique
          mkdir -p diagrams/libraries/chimie
          mkdir -p diagrams/libraries/instruments
          mkdir -p diagrams/libraries/securite
          mkdir -p diagrams/docs
          mkdir -p diagrams/templates


      # ==========================================================
      # 3. RÉCUPÉRATION DU DÉPÔT OFFICIEL DIAGRAMS.NET
      #
      # On utilise le dépôt officiel comme source.
      #
      # Cela évite les URL raw obsolètes.
      # ==============================================================

      - name: Récupérer diagrams.net
        run: |

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            --branch dev \
            https://github.com/jgraph/drawio.git \
            /tmp/drawio

          cd /tmp/drawio

          git sparse-checkout set \
            src/main/webapp/stencils/electrical


      # ==========================================================
      # 4. BIBLIOTHÈQUES ÉLECTRIQUES OFFICIELLES
      #
      # Ces fichiers correspondent aux bibliothèques réellement
      # utilisées par diagrams.net.
      # ==============================================================

      - name: Installer les bibliothèques électriques
        run: |

          cp /tmp/drawio/src/main/webapp/stencils/electrical/logic_gates.xml \
             diagrams/libraries/electricite/

          cp /tmp/drawio/src/main/webapp/stencils/electrical/resistors.xml \
             diagrams/libraries/electricite/

          cp /tmp/drawio/src/main/webapp/stencils/electrical/capacitors.xml \
             diagrams/libraries/electricite/

          cp /tmp/drawio/src/main/webapp/stencils/electrical/inductors.xml \
             diagrams/libraries/electricite/

          cp /tmp/drawio/src/main/webapp/stencils/electrical/diodes.xml \
             diagrams/libraries/electricite/

          cp /tmp/drawio/src/main/webapp/stencils/electrical/signal_sources.xml \
             diagrams/libraries/electricite/

          cp /tmp/drawio/src/main/webapp/stencils/electrical/instruments.xml \
             diagrams/libraries/electricite/

          cp /tmp/drawio/src/main/webapp/stencils/electrical/waveforms.xml \
             diagrams/libraries/electricite/

          cp /tmp/drawio/src/main/webapp/stencils/electrical/transistors.xml \
             diagrams/libraries/electricite/

          cp /tmp/drawio/src/main/webapp/stencils/electrical/mosfets1.xml \
             diagrams/libraries/electricite/

          cp /tmp/drawio/src/main/webapp/stencils/electrical/mosfets2.xml \
             diagrams/libraries/electricite/

          cp /tmp/drawio/src/main/webapp/stencils/electrical/opto_electronics.xml \
             diagrams/libraries/electricite/

          cp /tmp/drawio/src/main/webapp/stencils/electrical/electro-mechanical.xml \
             diagrams/libraries/electricite/


      # ==========================================================
      # 5. BIBLIOTHÈQUE ÉLECTRIQUE OWNTECH
      #
      # Projet :
      # owntech-foundation/LibraryDrawIO
      #
      # Licence :
      # CC-BY-SA-4.0
      # ==============================================================

      - name: Récupérer OwnTech
        run: |

          git clone \
            --depth 1 \
            https://github.com/owntech-foundation/LibraryDrawIO.git \
            /tmp/owntech

          cp /tmp/owntech/circuit_library.xml \
             diagrams/libraries/electricite/OwnTech-circuit.xml


      # ==========================================================
      # 6. BIBLIOTHÈQUE ÉLECTRIQUE COMPLÉMENTAIRE
      #
      # Projet :
      # bzarek/draw.io-electrical
      # ==============================================================

      - name: Récupérer draw.io-electrical
        run: |

          git clone \
            --depth 1 \
            https://github.com/bzarek/draw.io-electrical.git \
            /tmp/drawio-electrical

          cp /tmp/drawio-electrical/Custom_Electrical.xml \
             diagrams/libraries/electricite/Custom-Electrical.xml


      # ==========================================================
      # 7. PICTOGRAMMES DE VERRERIE / LABORATOIRE (SVG)
      #
      # Aucune bibliothèque diagrams.net dédiée à la verrerie de
      # chimie n'est disponible avec une licence de redistribution
      # claire. On récupère donc des pictogrammes SVG individuels
      # depuis Material Design Icons (Pictogrammers), sous licence
      # Apache License 2.0, qui couvrent la majorité du matériel
      # de laboratoire courant.
      #
      # Dépôt :
      # https://github.com/Templarian/MaterialDesign
      #
      # Les pictogrammes non couverts (burette, entonnoir, ampoule
      # à décanter, fiole jaugée, verre de montre, pissette,
      # spatule, agitateur) restent à ajouter manuellement : voir
      # diagrams/libraries/chimie/svg/README.md.
      # ==============================================================

      - name: Récupérer les pictogrammes de laboratoire (Material Design Icons)
        run: |

          mkdir -p diagrams/libraries/chimie/svg

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/Templarian/MaterialDesign.git \
            /tmp/mdi

          cd /tmp/mdi

          git sparse-checkout set svg

          cd "$GITHUB_WORKSPACE"

          curl -sSL \
            -o /tmp/mdi-license.txt \
            https://raw.githubusercontent.com/Templarian/MaterialDesign/master/LICENSE

          icons=(
            beaker
            beaker-outline
            flask
            flask-outline
            flask-round-bottom
            flask-round-bottom-outline
            test-tube
            test-tube-empty
            cylinder
            eyedropper
            thermometer
            scale-balance
            molecule
            atom
            periodic-table
            microscope
            weight-gram
          )

          for icon in "${icons[@]}"; do
            cp "/tmp/mdi/svg/${icon}.svg" "diagrams/libraries/chimie/svg/${icon}.svg"
          done

          cp /tmp/mdi-license.txt \
             diagrams/libraries/chimie/svg/LICENSE-material-design-icons.txt

          rm -f diagrams/libraries/chimie/svg/.gitkeep


      # ==========================================================
      # 8. INDEX DES PICTOGRAMMES CHIMIE (README dédié)
      # ==========================================================

      - name: Documenter les pictogrammes de chimie
        run: |

          cat > diagrams/libraries/chimie/svg/README.md <<'EOF'
          # Pictogrammes de laboratoire — MermozLab Chemistry

          Icônes SVG individuelles, à utiliser en complément des
          bibliothèques XML (importables une par une dans
          diagrams.net via File > Import).

          | Fichier | Usage suggéré |
          |---|---|
          | beaker.svg / beaker-outline.svg | Bécher |
          | flask.svg / flask-outline.svg | Erlenmeyer |
          | flask-round-bottom.svg / flask-round-bottom-outline.svg | Ballon (fond rond) |
          | test-tube.svg / test-tube-empty.svg | Tube à essais |
          | cylinder.svg | Éprouvette graduée |
          | eyedropper.svg | Pipette / compte-gouttes |
          | thermometer.svg | Thermomètre |
          | scale-balance.svg | Balance |
          | molecule.svg | Molécule |
          | atom.svg | Atome |
          | periodic-table.svg | Tableau périodique |
          | microscope.svg | Microscope |
          | weight-gram.svg | Masse / pesée |

          ## Encore à ajouter manuellement

          Aucune source librement redistribuable n'a été trouvée
          pour ces éléments ; à ajouter à la main (dessin ou SVG
          sous licence compatible) :

          - Burette
          - Entonnoir
          - Ampoule à décanter
          - Fiole jaugée
          - Verre de montre
          - Pissette
          - Spatule
          - Agitateur en verre

          ## Licence

          Icônes issues de Material Design Icons (Pictogrammers),
          Apache License 2.0. Voir LICENSE-material-design-icons.txt
          dans ce dossier et diagrams/libraries/SOURCES.md.

          EOF


      # ==========================================================
      # 9. PRÉPARATION CHIMIE / VERRERIE
      #
      # La bibliothèque XML MermozLab reste réservée aux SVG dont
      # la licence est vérifiée (voir étape 7 ci-dessus pour les
      # pictogrammes déjà intégrés).
      # ==============================================================

      - name: Préparer la bibliothèque Chimie MermozLab
        run: |

          cat > diagrams/libraries/chimie/README.md <<'EOF'
          # MermozLab Chemistry

