            --domaine-acoustique-1:  #0891B2; --domaine-acoustique-2:  #0E7490;
            --domaine-thermique-1:   #C1440E; --domaine-thermique-2:   #7A2E0E;
            --domaine-optique-1:     #8B5CF6; --domaine-optique-2:     #6D28D9;
