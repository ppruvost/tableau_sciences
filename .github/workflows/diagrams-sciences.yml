- Conductimètre

EOF


      # ==========================================================
      # 10. SÉCURITÉ
      # ==============================================================

      - name: Préparer la sécurité
        run: |

          cat > diagrams/libraries/securite/README.md <<'EOF'
# Sécurité MermozLab

Éléments prévus :

- Lunettes
- Gants
- Blouse
- Hotte
- Pictogrammes CLP
- Risque corrosif
