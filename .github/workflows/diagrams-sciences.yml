          footer a { color: var(--bleu-cuivre); }
          EOF


      # ==========================================================
      # 17. GÉNÉRER LA PAGE D'ACCÈS (index.html)
      #
      # Page HTML unique listant, par domaine, les bibliothèques
      # et pictogrammes réellement présents (lecture dynamique de
      # manifest.json), pour naviguer facilement dans le projet
      # (localement, via GitHub Pages, ou intégrée en <iframe> dans
      # le portail MermozLab via loadInFrame('./diagrams/index.html')).
      # Le style (charte MermozLab / SciLab / MathiLab) est chargé
      # depuis assets/style.css, généré à l'étape précédente.
      # ==========================================================

      - name: Générer la page d'accès du projet
        run: |

          python3 - <<'PYEOF'
          import json, pathlib, html

          base = pathlib.Path("diagrams")
          manifest = json.loads((base / "libraries" / "manifest.json").read_text(encoding="utf-8"))

          # Icône Font Awesome + famille de teinte "domaine" (palette
          # définie dans assets/style.css) pour chaque domaine du manifeste.
          DOMAIN_STYLE = {
              "electricite": ("fa-bolt", "electricite"),
              "energie":     ("fa-battery-full", "thermique"),
              "mecanique":   ("fa-cogs", "mecanique"),
              "acoustique":  ("fa-volume-high", "acoustique"),
              "optique":     ("fa-lightbulb", "optique"),
              "ondes":       ("fa-wave-square", "signaux"),
              "chimie":      ("fa-flask", "chimie"),
              "verrerie":    ("fa-vial", "chimie"),
              "mesures":     ("fa-ruler", "mecanique"),
              "securite":    ("fa-hard-hat", "thermique"),
          }

          def item_html(path):
              href = f"libraries/{path}"
              name = pathlib.Path(path).name
              label = html.escape(name)
              if path.endswith(".svg"):
                  return (
                      f'<li class="item"><a href="{href}" target="_blank">'
                      f'<img src="{href}" alt="{label}" loading="lazy">'
                      f'<span>{label}</span></a></li>'
                  )
              return (
                  f'<li class="item item-xml"><a href="{href}" target="_blank">'
                  f'<i class="fas fa-file-code file-icon" aria-hidden="true"></i>'
                  f'<span>{label}</span></a></li>'
              )

          sections = []
          nav_links = []
          for key, domain in manifest["domains"].items():
              libs = domain.get("libraries", [])
              if not libs:
                  continue
              icon, tone = DOMAIN_STYLE.get(key, ("fa-shapes", "mecanique"))
              nav_links.append(
                  f'<a href="#{key}"><i class="fas {icon}" aria-hidden="true"></i> '
                  f'{html.escape(domain["name"])}</a>'
              )
              items = "\n          ".join(item_html(p) for p in libs)
              sections.append(
                  f'<section id="{key}">'
                  f'<h2 class="domaine-{tone}"><i class="fas {icon}" aria-hidden="true"></i> '
                  f'{html.escape(domain["name"])}</h2>'
                  f'<ul class="grid">\n          {items}\n          </ul></section>'
              )

          sections_html = "\n\n        ".join(sections)
          nav_html = "\n  ".join(nav_links)

          page = f"""<!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="UTF-8">
          <title>MermozLab -- Bibliotheques sciences</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
          <link rel="stylesheet" href="assets/style.css">
          </head>
          <body>
          <header>
            <h1><i class="fas fa-diagram-project" aria-hidden="true"></i> MermozLab -- Bibliotheques sciences</h1>
            <p>Physique-chimie BAC Pro - diagrams.net</p>
          </header>
          <nav>
            <a href="editor.html" class="cta"><i class="fas fa-pen-to-square" aria-hidden="true"></i> Ouvrir l'editeur</a>
            {nav_html}
            <a href="libraries/SOURCES.md"><i class="fas fa-file-lines" aria-hidden="true"></i> Sources &amp; licences</a>
            <a href="docs/couverture-bac-pro.md"><i class="fas fa-list-check" aria-hidden="true"></i> Couverture BAC Pro</a>
          </nav>
          <main>
                  {sections_html}
          </main>
          <footer>
            Genere automatiquement par le workflow GitHub Actions
            <code>diagrams-sciences.yml</code>. Cliquer sur un pictogramme ou une
            bibliotheque l'ouvre ou la telecharge ; les fichiers .xml
            s'importent dans diagrams.net via File &gt; Import Library.
          </footer>
          </body>
          </html>
          """

          (base / "index.html").write_text(page, encoding="utf-8")
          print("index.html genere")
          PYEOF


      # ==========================================================
      # 18. GÉNÉRER LES ASSETS DE L'ÉDITEUR (editor.css / editor.js)
      #
      # editor.css complète assets/style.css avec la mise en page
      # du bandeau et de la zone d'iframe. editor.js implémente le
      # protocole postMessage requis par embed.diagrams.net (voir
      # commentaire détaillé dans l'étape suivante).
      # ==========================================================

      - name: Générer les assets de l'éditeur (editor.css / editor.js)
        run: |

          cat > diagrams/assets/editor.css <<'EOF'
          /* ════════════════════════════════════════════════════════════════
             assets/editor.css — MermozLab / Éditeur diagrams.net
             Complète assets/style.css (variables, polices) avec les règles
             propres à la page editor.html (bandeau + zone d'iframe).
             ════════════════════════════════════════════════════════════════ */

          html, body { margin: 0; height: 100%; }

          #topbar {
            height: 46px;
            background: var(--gris-ardoise);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0 1.2rem;
            font-family: var(--font-corps);
            font-size: .85rem;
          }

          #topbar .title {
            font-family: var(--font-titre);
            font-weight: 700;
            opacity: 1;
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: .5rem;
          }

          #topbar a {
            color: #fff;
            text-decoration: none;
            padding: .3rem .7rem;
            border-radius: var(--r-pill);
            background: rgba(255, 255, 255, .12);
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            transition: .2s;
          }

          #topbar a:hover { background: var(--bleu-cuivre); }

          #status {
            opacity: .7;
            font-style: italic;
            font-family: var(--font-corps);
          }

          #frame-wrap {
            position: absolute;
            top: 46px;
            left: 0;
            right: 0;
            bottom: 0;
          }

          iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
          }
          EOF

          cat > diagrams/assets/editor.js <<'EOF'
          /* ════════════════════════════════════════════════════════════════
             assets/editor.js — MermozLab / Éditeur diagrams.net
             Gère le protocole postMessage requis par embed.diagrams.net :
             l'iframe envoie un événement "init" une fois chargée, et attend
             en retour une action "load" contenant un diagramme à afficher.
             Sans cette réponse, l'éditeur reste bloqué (barre grisée, aucune
             page ni panneau de formes) — voir SOURCES.md / le workflow pour
             le détail du problème corrigé ici.
             ════════════════════════════════════════════════════════════════ */

          (function () {
            "use strict";

            var EMPTY_XML =
              '<mxGraphModel dx="800" dy="600" grid="1" gridSize="10" guides="1" ' +
              'tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" ' +
              'pageWidth="850" pageHeight="1100" math="0" shadow="0">' +
              '<root><mxCell id="0" /><mxCell id="1" parent="0" /></root>' +
              '</mxGraphModel>';

            var ORIGIN = "https://embed.diagrams.net";
            var frame = document.getElementById("drawio-frame");
            var status = document.getElementById("status");

            window.addEventListener("message", function (evt) {
              if (evt.origin !== ORIGIN) { return; }

              var msg;
              try {
                msg = JSON.parse(evt.data);
              } catch (e) {
                return;
              }

              if (msg.event === "init") {
                if (status) { status.textContent = ""; }
                frame.contentWindow.postMessage(JSON.stringify({
                  action: "load",
                  xml: EMPTY_XML,
                  autosave: 1
                }), ORIGIN);
              } else if (msg.event === "exit") {
                window.location.href = "index.html";
              }
            });
          })();
          EOF


      # ==========================================================
      # 19. GÉNÉRER LA PAGE ÉDITEUR (editor.html)
      #
      # Page qui encapsule l'éditeur diagrams.net complet, via
      # embed.diagrams.net (seul domaine de diagrams.net dont la
      # politique CSP autorise l'intégration en <iframe> ; voir
      # https://www.drawio.com/doc/faq/embed-mode).
      #
      # IMPORTANT : embed.diagrams.net exige le paramètre embed=1
      # ET un échange postMessage (protocole JSON documenté par
      # diagrams.net) pour initialiser réellement l'éditeur. Sans
      # cela, la page reste bloquée dans un état à moitié chargé
      # (barre de menu visible mais grisée, aucune page ni panneau
      # de formes) — c'est le bug corrigé par assets/editor.js : le
      # script répond à l'événement "init" envoyé par l'iframe avec
      # une action "load" contenant un diagramme vierge, ce qui
      # débloque l'éditeur.
      #
      # Contenu chargé :
      #   - catégories natives "general" et "electrical" (mêmes
      #     stencils que ceux archivés localement dans
      #     diagrams/libraries/electricite/, déjà intégrés
      #     nativement à l'application) ;
      #   - bibliothèques personnalisées OwnTech, bzarek et
      #     Material Design Icons (format mxlibrary officiel,
      #     chargées via clibs, glisser-déposer disponible).
      #
      # NOTE : les fichiers diagrams/libraries/electricite/*.xml
      # sont au format "stencil" interne de diagrams.net, pas au
      # format "bibliothèque personnalisée" (mxlibrary) attendu
      # par clibs ; ils restent une archive de référence (voir
      # SOURCES.md). Les mêmes formes sont déjà natives dans
      # l'éditeur via la catégorie "Electrical".
      # ==========================================================

      - name: Générer la page éditeur (editor.html)
        run: |

          cat > diagrams/editor.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="UTF-8">
          <title>MermozLab -- Editeur diagrams.net</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
          <link rel="stylesheet" href="assets/style.css">
          <link rel="stylesheet" href="assets/editor.css">
          </head>
          <body>
          <div id="topbar">
            <span class="title"><i class="fas fa-diagram-project" aria-hidden="true"></i> MermozLab -- Editeur diagrams.net</span>
            <span id="status">Chargement de l'editeur...</span>
            <a href="index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Retour au catalogue</a>
            <a href="https://app.diagrams.net/?splash=0&libs=general;electrical&clibs=Uhttps%3A%2F%2Fraw.githubusercontent.com%2Fowntech-foundation%2FLibraryDrawIO%2Fmain%2Fcircuit_library.xml;Uhttps%3A%2F%2Fraw.githubusercontent.com%2Fbzarek%2Fdraw.io-electrical%2Fmain%2FCustom_Electrical.xml;Uhttps%3A%2F%2Fjgraph.github.io%2Fdrawio-libs%2Flibs%2Fmaterial-design-icons.xml" target="_blank" rel="noopener"><i class="fas fa-up-right-from-square" aria-hidden="true"></i> Ouvrir en plein ecran</a>
          </div>
          <div id="frame-wrap">
            <iframe id="drawio-frame"
              src="https://embed.diagrams.net/?embed=1&ui=kennedy&spin=1&proto=json&libraries=1&splash=0&libs=general;electrical&clibs=Uhttps%3A%2F%2Fraw.githubusercontent.com%2Fowntech-foundation%2FLibraryDrawIO%2Fmain%2Fcircuit_library.xml;Uhttps%3A%2F%2Fraw.githubusercontent.com%2Fbzarek%2Fdraw.io-electrical%2Fmain%2FCustom_Electrical.xml;Uhttps%3A%2F%2Fjgraph.github.io%2Fdrawio-libs%2Flibs%2Fmaterial-design-icons.xml"
              title="Editeur diagrams.net -- MermozLab"
              allow="clipboard-read; clipboard-write"
              referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
          </div>
          <script src="assets/editor.js"></script>
          </body>
          </html>
          EOF


      # ==========================================================
      # 20. VÉRIFICATION DES FICHIERS
      # ==============================================================

      - name: Vérifier les fichiers XML
        run: |

          echo "=============================================="
