      # ==========================================================
      # 8. BIBLIOTHÈQUE OPTIQUE / PHYSIQUE
      #
      # On réserve cette catégorie pour les éléments qui seront
      # intégrés dans la bibliothèque scientifique MermozLab.
      # ==============================================================

      - name: Préparer les bibliothèques de physique
        run: |

          cat > diagrams/libraries/physique/README.md <<'EOF'
