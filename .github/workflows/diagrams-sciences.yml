            "diagrams/libraries/chimie/svg/LICENSE-material-design-icons.txt"
            "diagrams/libraries/chimie/svg/README.md"

            "diagrams/libraries/manifest.json"
            "diagrams/libraries/SOURCES.md"
            "diagrams/docs/couverture-bac-pro.md"
            "diagrams/index.html"
            "diagrams/editor.html"
          )

          for file in "${required_files[@]}"; do

            if [ ! -s "$file" ]; then

              echo "ERREUR : fichier manquant : $file"
              exit 1

            fi

            echo "OK : $file"

          done


      # ==========================================================
      # 20. INFORMATIONS DE FIN
      # ==============================================================

      - name: Résumé
        run: |

          echo ""
          echo "=============================================="
          echo " MERMOZLAB - INSTALLATION TERMINÉE"
          echo "=============================================="
          echo ""

          echo "Bibliothèques électriques :"
          find diagrams/libraries/electricite \
            -maxdepth 1 \
            -type f \
            -name "*.xml" \
            -printf "  ✓ %f\n"

          echo ""
          echo "Pictogrammes de laboratoire :"
          find diagrams/libraries/chimie/svg \
