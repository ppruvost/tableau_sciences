name: diagrams-sciences

on:
  push:
    branches: [main]
    paths:
      - "diagrams/libraries/**"
      - "diagrams/scripts/**"
  pull_request:
    paths:
      - "diagrams/libraries/**"
      - "diagrams/scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerer-index:
    name: Regenerer diagrams/index.html
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 2. Recuperer le depot
        uses: actions/checkout@v4
      - name: 3. Preparer Python (bibliotheque standard uniquement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 4. Regenerer index.html a partir de manifest.json
        run: python3 diagrams/scripts/generate_index.py
      - name: 5. Committer et pousser si index.html a change
        run: |
          if git diff --quiet -- diagrams/index.html; then
            echo "Aucun changement : diagrams/index.html est deja a jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagrams/index.html
          git commit -m "chore(diagrams): regenere index.html depuis manifest.json [skip ci]"
          git push

  verifier-index:
    name: Verifier diagrams/index.html (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 2. Recuperer le depot
        uses: actions/checkout@v4
      - name: 3. Preparer Python (bibliotheque standard uniquement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 6. Verifier que index.html correspond a manifest.json
        run: python3 diagrams/scripts/generate_index.py --check
