EOF


      # ==========================================================
      # 12. CONTRÔLE DES FICHIERS
      # ==========================================================

      - name: Vérifier les bibliothèques
        run: |

          echo "=========================================="
          echo " MERMOZLAB - BIBLIOTHÈQUES DIAGRAMS.NET"
          echo "=========================================="

          find diagrams/libraries \
            -type f \
            | sort

          echo ""
          echo "=========================================="
          echo " VÉRIFICATION XML"
          echo "=========================================="

          for file in $(find diagrams/libraries -name "*.xml"); do

            echo "→ $file"

            test -s "$file" || {
              echo "ERREUR : fichier vide"
              exit 1
            }

          done


      # ==========================================================
      # 13. VÉRIFICATION DE LA STRUCTURE
      # ==========================================================

      - name: Vérifier la structure MermozLab
        run: |

          test -d diagrams/libraries/electricite
          test -d diagrams/libraries/physique
          test -d diagrams/libraries/chimie
          test -d diagrams/libraries/instruments
          test -d diagrams/libraries/securite

          test -f diagrams/libraries/manifest.json
          test -f diagrams/libraries/SOURCES.md
          test -f diagrams/docs/couverture-bac-pro.md

          echo "Structure MermozLab OK."


      # ==========================================================
      # 14. COMMIT AUTOMATIQUE
      # ==========================================================

      - name: Enregistrer les modifications
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add diagrams/

          if git diff --cached --quiet; then

            echo "Aucune modification à enregistrer."

          else

            git commit \
              -m "Ajout des bibliothèques sciences BAC Pro MermozLab"

            git push

          fi
```
