            position: sticky; top: 0; display: flex; flex-wrap: wrap; gap: .5rem; z-index: 10;
          }
          nav a {
            color: var(--bleu-fonce); text-decoration: none; font-size: .8rem; font-weight: 400;
            padding: .35rem .75rem; border-radius: var(--r-pill); background: var(--bleu-clair-bg);
            display: inline-flex; align-items: center; gap: .4rem; transition: .2s;
          }
          nav a:hover { background: var(--bleu-cuivre); color: #fff; }
          nav a.cta { background: var(--bleu-cuivre); color: #fff; font-weight: 700; }
          nav a.cta:hover { background: var(--bleu-fonce); }

          /* ── Contenu / sections domaine ── */
          main { padding: 1.6rem 2rem 3rem; max-width: 1200px; margin: 0 auto; }
          section { margin-bottom: 2rem; background: #fff; border-radius: var(--r-lg); box-shadow: var(--ombre-carte); overflow: hidden; }
          section h2 {
            margin: 0; padding: .85rem 1.2rem; font-family: var(--font-titre); font-weight: 600;
            font-size: 1rem; color: #fff; display: flex; align-items: center; gap: .6rem;
          }

          .domaine-electricite { background: linear-gradient(135deg, var(--domaine-electricite-1), var(--domaine-electricite-2)); }
          .domaine-mecanique   { background: linear-gradient(135deg, var(--domaine-mecanique-1), var(--domaine-mecanique-2)); }
          .domaine-chimie      { background: linear-gradient(135deg, var(--domaine-chimie-1), var(--domaine-chimie-2)); }
          .domaine-acoustique  { background: linear-gradient(135deg, var(--domaine-acoustique-1), var(--domaine-acoustique-2)); }
          .domaine-thermique   { background: linear-gradient(135deg, var(--domaine-thermique-1), var(--domaine-thermique-2)); }
          .domaine-optique     { background: linear-gradient(135deg, var(--domaine-optique-1), var(--domaine-optique-2)); }
          .domaine-signaux     { background: linear-gradient(135deg, var(--domaine-signaux-1), var(--domaine-signaux-2)); }

          /* ── Grille de fichiers / pictogrammes ── */
          ul.grid {
            list-style: none; margin: 0; padding: 1.1rem; display: grid;
