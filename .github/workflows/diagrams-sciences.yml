- Loi d'Ohm
- Puissance
- Énergie
- Générateurs
- Récepteurs
- Moteurs
- Transformateurs
- Diodes
- DEL
- Condensateurs
- Mesures électriques

### Énergie

- Production
- Transport
- Distribution
- Conversion
- Puissance
- Énergie
- Rendement

### Mécanique

- Mouvement
- Trajectoire
- Vitesse
- Forces
- Poids
- Équilibre
- Travail
- Énergie mécanique

### Acoustique

- Source sonore
- Haut-parleur
- Microphone
- Propagation
- Fréquence
- Période
- Amplitude
- Niveau sonore
- Spectre
- GBF
- Oscilloscope
- Sonomètre

### Optique

- Source lumineuse
- Rayon
- Faisceau
- Réflexion
- Réfraction
- Miroir
- Lentille
- Image
- Œil
- Fibre optique

### Ondes et signaux

- Signal périodique
- Fréquence
- Période
- Longueur d'onde
