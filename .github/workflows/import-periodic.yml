name: Import periodic (one-off, sans historique)

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout tableau_sciences
        uses: actions/checkout@v4

      - name: Clone periodic (shallow, sans .git)
        run: |
          git clone --depth 1 https://github.com/ppruvost/periodic.git /tmp/periodic
          rm -rf /tmp/periodic/.git

      - name: Copier dans /periodic
        run: |
          mkdir -p periodic
          rm -rf periodic/*
          rm -rf periodic/.[!.]* periodic/..?* 2>/dev/null || true
          cp -r /tmp/periodic/. periodic/

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add periodic

          if git diff --cached --quiet; then
            echo "Rien à committer"
          else
            git commit -m "Import periodic (contenu actuel, sans historique)"
            git push
          fi
