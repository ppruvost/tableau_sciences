name: Sync from Codeberg

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # 1. Récupérer le dépôt GitHub
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Récupérer Codeberg
      - name: Fetch Codeberg
        run: |
          git remote add codeberg https://codeberg.org/mermoz/sciences.git
          git fetch codeberg main

      # 3. Copier le contenu de Codeberg
      #    mais NE PAS toucher au workflow GitHub
      - name: Synchronize site files
        run: |
          rm -rf /tmp/codeberg
          mkdir -p /tmp/codeberg

          git archive codeberg/main | tar -x -C /tmp/codeberg

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/codeberg/ ./

      # 4. Envoyer les modifications vers GitHub
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Aucune modification à synchroniser."
            exit 0
          fi

          git commit -m "Sync from Codeberg"
          git push origin main
