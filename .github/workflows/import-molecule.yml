name: Import molecule (one-off, sans historique)

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tableau_sciences
        uses: actions/checkout@v4

      - name: Clone molecule (shallow, sans .git)
        run: |
          git clone --depth 1 https://github.com/ppruvost/molecule.git /tmp/molecule
          rm -rf /tmp/molecule/.git

      - name: Copier dans /molecule
        run: |
          mkdir -p molecule
          rm -rf molecule/*
          cp -r /tmp/molecule/. molecule/

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add molecule
          git diff --cached --quiet && echo "Rien à committer" || git commit -m "Import molecule"
          git push
