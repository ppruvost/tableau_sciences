name: Import playmaths-arcade → playlab (one-off, sans historique)

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tableau_sciences
        uses: actions/checkout@v4

      - name: Clone playmaths-arcade (shallow, sans .git)
        run: |
          git clone --depth 1 https://github.com/ppruvost/playmaths-arcade.git /tmp/playmaths-arcade
          rm -rf /tmp/playmaths-arcade/.git

      - name: Copier dans /playlab
        run: |
          mkdir -p playlab
          rm -rf playlab/*
          cp -r /tmp/playmaths-arcade/. playlab/

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlab
          git diff --cached --quiet && echo "Rien à committer" || git commit -m "Import playmaths-arcade → playlab"
          git push
