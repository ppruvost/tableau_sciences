<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathiLab</title>

  <!-- CSS principal -->
  <link rel="stylesheet" href="style.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

  <!-- ================= MENU HORIZONTAL ================= -->
  <div class="top-menu">

    <div class="menu-item active" onclick="showSection('tp-home', this)">
      <i class="fas fa-graduation-cap"></i> Domaines TD
    </div>

    <div class="menu-item" onclick="showSection('glassware', this)">
      <i class="fas fa-vial"></i> Verrerie
    </div>

    <div class="menu-item"
         onclick="loadInFrame('https://ppruvost.github.io/periodic/', this)">
      <i class="fas fa-atom"></i> Table périodique
    </div>

    <div class="menu-item"
         onclick="loadInFrame('https://ppruvost.github.io/molecule/', this)">
      <i class="fas fa-cubes"></i> Molécules
    </div>

    <div class="menu-item"
         onclick="loadInFrame('https://ppruvost.github.io/Uncertainty/', this)">
      <i class="fas fa-ruler"></i> Mesures et Incertitudes
    </div>

  </div>

  <!-- ================= CONTENU ================= -->
  <div class="container">

    <!-- ====== PAGE ACCUEIL ====== -->
    <div id="tp-home" class="section active">
      <h1 class="tp-title">Choisir un domaine</h1>

      <div class="tp-grid">

        <div class="tp-card statistiques" id="openStatistiques" data-domaine="statistiques">
          <i class="fas fa-chart-column"></i>
          <span>Statistique et probabilités</span>
        </div>

        <div class="tp-card mecanique" id="openMecanique" data-domaine="mecanique">
          <i class="fas fa-cogs"></i>
          <span>Algèbre – Analyse</span>
        </div>

        <div class="tp-card chimie" id="openChimie" data-domaine="chimie">
          <i class="fas fa-flask"></i>
          <span>Géométrie</span>
        </div>

        <div class="tp-card acoustique" id="openAcoustique" data-domaine="acoustique">
          <i class="fas fa-volume-up"></i>
          <span>Algorithmique et programmation</span>
        </div>

      </div>
    </div>

    <!-- ====== VERRERIE ====== -->
    <div id="glassware" class="section">
      <h2>Verrerie</h2>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nom</th><th>Contenance</th><th>Lieu</th><th>Image</th>
            </tr>
          </thead>
          <tbody id="glassware-body"></tbody>
        </table>
      </div>
    </div>

    <!-- ====== EXTERNE ====== -->
    <div id="external-content" class="section">
      <iframe id="external-frame"></iframe>
    </div>

  </div>

  <!-- ================= NAVIGATION JS ================= -->
  <script>
    function setActive(element) {
      document.querySelectorAll(".menu-item").forEach(i => i.classList.remove("active"));
      if (element) element.classList.add("active");
    }

    function showSection(sectionId, element = null) {
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      document.getElementById(sectionId)?.classList.add("active");
      setActive(element);
    }

    function loadInFrame(url, element = null) {
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      const frameSection = document.getElementById("external-content");
      const iframe = document.getElementById("external-frame");

      iframe.src = url;
      frameSection.classList.add("active");

      setActive(element);
    }

    window.showSection = showSection;
    window.loadInFrame = loadInFrame;
  </script>

  <!-- ================= IMPORTANT : MODULE UNIQUEMENT ================= -->
  <script type="module" src="js/app.js"></script>

  <!-- ====== VIEWER TP ====== -->
  <div id="tpViewer" class="tp-viewer hidden">
    <div class="viewer-topbar">
      <h2>Travaux Dirigés</h2>
      <button id="closeViewer">✖ Fermer</button>
    </div>
    <iframe id="tpFrame"></iframe>
  </div>


</body>
</html>
