
name: Synchronisation du site public élèves

on:
  schedule:
    - cron: "30 0 * * *"
      timezone: Europe/Paris

  workflow_dispatch:

jobs:
  synchronisation:
    runs-on: docker

    steps:
      - name: Installer Git
        run: |
          apt-get update
          apt-get install -y git

      - name: Récupérer le dépôt de développement
        run: |
          git clone \
            --branch main \
            --single-branch \
            https://codeberg.org/MermozLab/sciences.git \
            sciences

      - name: Synchroniser le site public
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          cd sciences

          git config user.name "Mermoz Sciences Bot"
          git config user.email "actions@codeberg.org"

          git remote add public \
            "https://ppruvost:${TARGET_TOKEN}@codeberg.org/ppruvost/sciences.git"

          git push --force public main:main
