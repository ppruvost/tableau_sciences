name: Synchroniser les dépôts miroirs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer tout l'historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pousser vers les dépôts miroirs
        env:
          BRANCH: ${{ github.ref_name }}
          CB_USER: ${{ secrets.CODEBERG_USER }}
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          GH_USER: ${{ secrets.GH_SYNC_USER }}
          GH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
        run: |
          set -u
          fail=0

          push_to () {
            name="$1"; url="$2"
            echo "==> $name"
            if git push --force "$url" "HEAD:refs/heads/${BRANCH}" --tags; then
              echo "OK : $name"
            else
              echo "ECHEC : $name"; fail=1
            fi
          }

          push_to "codeberg.org/mermoz/sciences" \
            "https://${CB_USER}:${CB_TOKEN}@codeberg.org/mermoz/sciences.git"
          push_to "codeberg.org/ppruvost/sciences" \
            "https://${CB_USER}:${CB_TOKEN}@codeberg.org/ppruvost/sciences.git"
          push_to "github.com/ppruvost/tableau_sciences" \
            "https://${GH_USER}:${GH_TOKEN}@github.com/ppruvost/tableau_sciences.git"

          exit $fail